<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>body{margin:0;background:var(--paper);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-3);padding:var(--space-4)}.foot{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;margin-top:var(--space-1)}</style>
</head>
<body>
<div class="grid">
  <article class="aura-card">
    <span class="aura-card__eyebrow">Sistema · PDV</span>
    <h3 class="aura-card__title">AM Kaixara</h3>
    <p class="aura-card__body">Vendas no balcão, estoque e fechamento de caixa para pequenos comércios.</p>
    <div class="foot"><span class="aura-badge aura-badge--warning">Em construção</span><button class="aura-btn aura-btn--secondary">Abrir</button></div>
  </article>
  <article class="aura-card">
    <span class="aura-card__eyebrow">Curso · Lançamento</span>
    <h3 class="aura-card__title">Lógica de Programação</h3>
    <p class="aura-card__body">Mini-curso de entrada do Instituto AMS, do zero aos primeiros programas.</p>
    <div class="foot"><span class="aura-badge aura-badge--brand">F1</span><button class="aura-btn aura-btn--primary">Ver curso</button></div>
  </article>
</div>
<script></script>
</body>
</html>
