<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
html,body{margin:0;background:var(--paper)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--paper)}
svg{position:absolute;left:0;top:0}
.aura{fill:var(--aura-900)} .gold{fill:var(--gold-500)} .tint{fill:var(--aura-tint)} .gtint{fill:var(--gold-tint)} .dot{fill:var(--aura-900)}
.r-lg{rx:var(--radius-lg)} .r-md{rx:var(--radius-md)}
.rule{stroke:var(--gold-500);stroke-width:1;stroke-dasharray:4 4}
.name{position:absolute;left:40px;bottom:64px;margin:0;font-family:var(--font-display);font-weight:600;font-size:72px;line-height:.95;color:var(--ink);max-width:440px}
.tag{position:absolute;left:40px;bottom:36px;margin:0;font-family:var(--font-sans);font-size:14px;color:var(--muted);max-width:440px}
</style>
</head>
<body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: aura-900 (440x56), gold-500 (288x32), aura-tint (400x88), gold-tint (200x40) — the brand teal and gold lead, tints for relief
arrangement: horizontal strata of unequal bands, bleeding off the right edge, like the layered architecture the system documents
pattern: dot grid at space-4 pitch on the aura-tint band — "precise, technical, layered": the system draws stacks of layers joined by connections
scales: band gaps space-4 (16px), corners radius-lg on bands and radius-md on the small band, dots r=2 at 16px pitch, one dashed hairline (border-hairline, gold-500)
-->
<rect class="aura r-lg" x="520" y="24" width="460" height="56"/>
<rect class="gold r-md" x="600" y="96" width="380" height="32"/>
<rect class="tint r-lg" x="520" y="144" width="460" height="88"/>
<rect class="gtint r-md" x="680" y="248" width="300" height="40"/>
<line class="rule" x1="504" y1="88" x2="504" y2="240"/>
<g>
<circle class="dot" cx="544" cy="168" r="2"/><circle class="dot" cx="560" cy="168" r="2"/><circle class="dot" cx="576" cy="168" r="2"/><circle class="dot" cx="592" cy="168" r="2"/><circle class="dot" cx="608" cy="168" r="2"/><circle class="dot" cx="624" cy="168" r="2"/><circle class="dot" cx="640" cy="168" r="2"/><circle class="dot" cx="656" cy="168" r="2"/><circle class="dot" cx="672" cy="168" r="2"/><circle class="dot" cx="688" cy="168" r="2"/><circle class="dot" cx="704" cy="168" r="2"/><circle class="dot" cx="720" cy="168" r="2"/>
<circle class="dot" cx="544" cy="184" r="2"/><circle class="dot" cx="560" cy="184" r="2"/><circle class="dot" cx="576" cy="184" r="2"/><circle class="dot" cx="592" cy="184" r="2"/><circle class="dot" cx="608" cy="184" r="2"/><circle class="dot" cx="624" cy="184" r="2"/><circle class="dot" cx="640" cy="184" r="2"/><circle class="dot" cx="656" cy="184" r="2"/><circle class="dot" cx="672" cy="184" r="2"/><circle class="dot" cx="688" cy="184" r="2"/><circle class="dot" cx="704" cy="184" r="2"/><circle class="dot" cx="720" cy="184" r="2"/>
<circle class="dot" cx="544" cy="200" r="2"/><circle class="dot" cx="560" cy="200" r="2"/><circle class="dot" cx="576" cy="200" r="2"/><circle class="dot" cx="592" cy="200" r="2"/><circle class="dot" cx="608" cy="200" r="2"/><circle class="dot" cx="624" cy="200" r="2"/><circle class="dot" cx="640" cy="200" r="2"/><circle class="dot" cx="656" cy="200" r="2"/><circle class="dot" cx="672" cy="200" r="2"/><circle class="dot" cx="688" cy="200" r="2"/><circle class="dot" cx="704" cy="200" r="2"/><circle class="dot" cx="720" cy="200" r="2"/>
</g>
</svg>
<h1 class="name">Aura Design System</h1>
<p class="tag">A identidade dos sistemas AM e da Grupo AMtech Digital.</p>
</div>
<script></script>
</body>
</html>
