<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Caixa da Casa 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>/* Layout: menu lateral fixo no computador; no celular, barra inferior com o "+" no meio.
   Livro-caixa: superfícies claras, tinta esverdeada, números alinhados e um único acento petróleo. */
:root {
  --fundo: #f5f7f6;
  --superficie: #ffffff;
  --superficie-2: #edf1ef;
  --tinta: #16201c;
  --tinta-2: #46534e;
  --tinta-3: #5a6660;
  --linha: #d9e0dc;
  --acento: #0e5e69;
  --acento-tinta: #ffffff;
  --acento-claro: #e0eef0;
  --ok: #1b7443;
  --ok-claro: #e3f3ea;
  --aviso: #8a5a00;
  --aviso-claro: #fbf1dc;
  --critico: #b0261e;
  --critico-claro: #fbe7e5;
  --info-claro: #e6eef9;
  --serie-1: #2a78d6;
  --serie-2: #eb6834;
  --serie-3: #1baf7a;
  --sombra: 0 1px 2px rgb(22 32 28 / 6%), 0 4px 16px rgb(22 32 28 / 6%);
  --fonte: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fonte-titulo: "Bricolage Grotesque", "Public Sans", system-ui, sans-serif;
  --raio: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0e1312;
    --superficie: #151c1a;
    --superficie-2: #1c2523;
    --tinta: #e6ecea;
    --tinta-2: #b4bfba;
    --tinta-3: #8c9893;
    --linha: #29332f;
    --acento: #5cb8c3;
    --acento-tinta: #0b1a1c;
    --acento-claro: #163338;
    --ok: #55c58a;
    --ok-claro: #143022;
    --aviso: #e2a63c;
    --aviso-claro: #33280f;
    --critico: #f28a82;
    --critico-claro: #3a1a18;
    --info-claro: #172a40;
    --serie-1: #3987e5;
    --serie-2: #d95926;
    --serie-3: #199e70;
    --sombra: 0 1px 2px rgb(0 0 0 / 30%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #0e1312;
  --superficie: #151c1a;
  --superficie-2: #1c2523;
  --tinta: #e6ecea;
  --tinta-2: #b4bfba;
  --tinta-3: #8c9893;
  --linha: #29332f;
  --acento: #5cb8c3;
  --acento-tinta: #0b1a1c;
  --acento-claro: #163338;
  --ok: #55c58a;
  --ok-claro: #143022;
  --aviso: #e2a63c;
  --aviso-claro: #33280f;
  --critico: #f28a82;
  --critico-claro: #3a1a18;
  --info-claro: #172a40;
  --serie-1: #3987e5;
  --serie-2: #d95926;
  --serie-3: #199e70;
  --sombra: 0 1px 2px rgb(0 0 0 / 30%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--fundo); color: var(--tinta); }
body { font-family: var(--fonte); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fundo); }
h1, h2, h3 { font-family: var(--fonte-titulo); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3.subtitulo { font-size: 0.95rem; font-weight: 600; margin-top: 8px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
.mut { color: var(--tinta-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* --------------------------------------------------------------- estrutura */
.app { min-height: 100%; }
.lateral {
  position: fixed; inset: 0 auto 0 0; width: 232px; padding: max(20px, env(safe-area-inset-top, 0px)) 14px 20px max(14px, env(safe-area-inset-left, 0px));
  background: var(--superficie); border-right: 1px solid var(--linha); overflow-y: auto; z-index: 20;
}
.marca { display: grid; gap: 2px; padding: 0 8px 18px; }
.marca-nome { font-family: var(--fonte-titulo); font-weight: 700; font-size: 1.15rem; color: var(--acento); letter-spacing: -0.02em; }
.marca-pessoa { color: var(--tinta-3); font-size: 0.85rem; }
.nav { display: grid; gap: 14px; }
.nav-grupo { display: grid; gap: 2px; }
.nav-titulo { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-3); padding: 0 8px 4px; font-weight: 600; }
.nav-item { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--tinta-2); }
.nav-item:hover { background: var(--superficie-2); color: var(--tinta); }
.nav-item.ativo { background: var(--acento-claro); color: var(--acento); font-weight: 600; }
.principal { margin-left: 232px; min-width: 0; }
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding-block: 14px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--fundo) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha);
}
.topo-titulo { font-size: 1.35rem; font-weight: 700; }
.topo-acoes { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.conteudo { padding-block: 22px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); max-width: 1160px; }
.barra-inferior { display: none; }
.faixa-demo {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  margin-left: 232px; padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--aviso-claro); color: var(--tinta); border-bottom: 1px solid var(--linha); font-size: 0.9rem;
}

@media (max-width: 820px) {
  .lateral { display: none; }
  .principal, .faixa-demo { margin-left: 0; }
  .topo { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
  .topo-titulo { font-size: 1.15rem; }
  .conteudo { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .so-largo { display: none; }
  .barra-inferior {
    display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; align-items: center; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    background: var(--superficie); border-top: 1px solid var(--linha);
  }
  .barra-inferior button { background: none; border: 0; padding: 10px 4px; font-size: 0.78rem; color: var(--tinta-2); min-height: 44px; cursor: pointer; }
  .barra-inferior button.ativo { color: var(--acento); font-weight: 650; }
  .barra-inferior .botao-mais-lancar { width: 52px; height: 52px; border-radius: 50%; justify-self: center; background: var(--acento); color: var(--acento-tinta); font-size: 1.6rem; line-height: 1; box-shadow: var(--sombra); }
}

/* ---------------------------------------------------------------- blocos */
.pilha { display: grid; gap: 12px; }
.pilha-grande { display: grid; gap: 20px; }
.duas-colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px; align-items: start; }
.grade-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
.painel { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.painel-compacto { padding: 14px 16px; gap: 6px; }
.painel-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.painel-cab h2 .mut { font-weight: 500; font-family: var(--fonte); font-size: 0.92rem; margin-left: 4px; font-variant-numeric: tabular-nums; }
.linha-botoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.linha-botoes-fim { justify-content: flex-end; width: 100%; }
.espaco { flex: 1; }
.explicacao { color: var(--tinta-2); max-width: 70ch; }
.dica { color: var(--tinta-3); font-size: 0.86rem; max-width: 75ch; }

/* --------------------------------------------------------------- destaque */
.destaque { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 22px; }
.destaque-principal { display: grid; gap: 8px; align-content: start; }
.destaque-rotulo { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--tinta-3); font-weight: 600; }
.destaque-valor { font-family: var(--fonte-titulo); font-size: clamp(2.1rem, 6vw, 3.1rem); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.destaque-conta { color: var(--tinta-2); font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.destaque-numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-content: start; border-left: 1px solid var(--linha); padding-left: 18px; }
@media (max-width: 820px) { .destaque { grid-template-columns: 1fr; padding: 18px; } .destaque-numeros { border-left: 0; padding-left: 0; border-top: 1px solid var(--linha); padding-top: 14px; } }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 12px; }
.numeros > .numero { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; }
.painel .numeros > .numero { background: var(--superficie-2); border: 0; }
.numero { display: grid; gap: 2px; align-content: start; min-width: 0; }
.numero-rotulo { font-size: 0.78rem; color: var(--tinta-3); font-weight: 600; letter-spacing: 0.02em; }
.numero-valor { font-size: 1.25rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.numero-destaque .numero-valor { font-size: 1.55rem; color: var(--acento); }
.numero-sub { font-size: 0.82rem; color: var(--tinta-3); }

/* ---------------------------------------------------------------- valores */
.valor { font-variant-numeric: tabular-nums; white-space: nowrap; }
.valor-forte { font-weight: 650; }
.valor-previsto { color: var(--tinta-2); font-style: italic; }
.valor-neg { color: var(--critico); }
.valor-pos { color: var(--ok); }
.valor-falta { color: var(--aviso); font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; width: fit-content; }
.selo-realizado { background: var(--ok-claro); color: var(--ok); }
.selo-previsto { background: var(--superficie-2); color: var(--tinta-2); }
.selo-falta_informar { background: var(--aviso-claro); color: var(--aviso); }

/* ----------------------------------------------------------------- listas */
.lista { list-style: none; margin: 0; padding: 0; display: grid; }
.linha { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--linha); }
.lista .linha:first-child { border-top: 0; }
.linha-corpo { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 2px; background: none; border: 0; text-align: left; }
button.linha-corpo { cursor: pointer; }
button.linha-corpo:hover .linha-nome { color: var(--acento); }
.linha-texto { display: grid; min-width: 0; }
.linha-nome { overflow-wrap: anywhere; }
.linha-sub { font-size: 0.82rem; color: var(--tinta-3); overflow-wrap: anywhere; }
.linha-fim { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.linha-acao { flex-shrink: 0; }
.linha-form { flex-wrap: wrap; justify-content: flex-start; }
.linha-form input:not([type="checkbox"]) { max-width: 260px; }
@media (max-width: 520px) { .linha-fim .selo { display: none; } }

/* ---------------------------------------------------------------- botões */
.btn { border-radius: 8px; padding: 9px 14px; border: 1px solid var(--linha); background: var(--superficie); cursor: pointer; font-weight: 550; min-height: 40px; white-space: nowrap; }
.btn:hover { border-color: var(--tinta-3); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primario { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); }
.btn-primario:hover { filter: brightness(1.08); border-color: var(--acento); }
.btn-fantasma { background: none; border-color: transparent; color: var(--tinta-2); }
.btn-fantasma:hover { background: var(--superficie-2); border-color: transparent; }
.btn-perigo { background: var(--critico); border-color: var(--critico); color: #fff; }
.btn-peq { padding: 5px 10px; min-height: 32px; font-size: 0.85rem; }
.btn-icone { padding: 4px 10px; font-size: 1.2rem; line-height: 1; min-height: 36px; }
.btn-claro { background: var(--superficie); color: var(--tinta); border-color: var(--linha); }
.btn-grande { padding: 14px; font-size: 1rem; }
.link { background: none; border: 0; padding: 0; color: var(--acento); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; }

/* ------------------------------------------------------------ mês e abas */
.seletor-mes { display: inline-flex; align-items: center; gap: 2px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; padding: 2px; width: fit-content; }
.seletor-mes-nome { min-width: 150px; text-align: center; font-weight: 600; font-size: 0.92rem; }
.abas { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--linha); }
.aba { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer; color: var(--tinta-2); white-space: nowrap; margin-bottom: -1px; }
.aba.ativa { color: var(--acento); border-bottom-color: var(--acento); font-weight: 650; }

/* --------------------------------------------------------------- tabelas */
.tabela-rolagem { overflow-x: auto; max-width: 100%; }
.tabela { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tabela th { text-align: left; font-weight: 600; font-size: 0.78rem; color: var(--tinta-3); padding: 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
.tabela td { padding: 9px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
.tabela td .mut { font-size: 0.8rem; }
.tabela select { max-width: 180px; padding: 4px 6px; }
.linha-total td { font-weight: 650; border-bottom: 0; }
.linha-apagada td { color: var(--tinta-3); }
.linha-apagada td .mut { color: var(--tinta-3); }

/* -------------------------------------------------------------- alertas */
.alerta { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--linha); }
.alerta-texto { flex: 1 1 260px; min-width: 0; }
.alerta-aviso { background: var(--aviso-claro); border-color: color-mix(in srgb, var(--aviso) 30%, transparent); }
.alerta-critico { background: var(--critico-claro); border-color: color-mix(in srgb, var(--critico) 35%, transparent); }
.alerta-ok { background: var(--ok-claro); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.alerta-info { background: var(--info-claro); }
.vazio { display: grid; gap: 8px; justify-items: start; padding: 22px; border: 1px dashed var(--linha); border-radius: var(--raio); background: var(--superficie); }
.vazio-titulo { font-weight: 650; }
.detalhes summary { cursor: pointer; color: var(--acento); font-weight: 550; padding: 4px 0; }
.detalhes-corpo { padding-top: 8px; }
.dl-grade { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.dl-grade dt { color: var(--tinta-3); font-size: 0.86rem; }
.dl-grade dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.dl-tres { grid-template-columns: repeat(3, minmax(0, 1fr) auto); }
@media (min-width: 721px) { .dl-tres dd { white-space: nowrap; } }
@media (max-width: 720px) { .dl-tres { grid-template-columns: minmax(0, auto) minmax(0, 1fr); } }

/* ------------------------------------------------------------- formulário */
.form-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.campo { grid-column: 1 / -1; display: grid; gap: 4px; min-width: 0; }
.campo-meia { grid-column: span 1; }
@media (max-width: 520px) { .campo-meia { grid-column: 1 / -1; } }
.campo label, .filtro span { font-size: 0.84rem; font-weight: 600; color: var(--tinta-2); }
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea {
  width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--linha); border-radius: 8px; background: var(--superficie);
}
textarea { min-height: 80px; resize: vertical; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--critico); }
.campo-dinheiro { display: flex; align-items: center; gap: 6px; }
.campo-dinheiro span { color: var(--tinta-3); font-size: 0.9rem; }
.campo-ajuda { font-size: 0.8rem; color: var(--tinta-3); }
.campo-erro { font-size: 0.82rem; color: var(--critico); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--acento); }
.filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.filtro { display: grid; gap: 4px; min-width: 150px; }
.filtro-busca { flex: 1 1 220px; }
.busca-curta { max-width: 220px; }
.caixa-texto { font-family: ui-monospace, monospace; font-size: 0.8rem; }
.escolha-tipo { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.escolha-tipo legend { font-weight: 600; font-size: 0.84rem; color: var(--tinta-2); margin-bottom: 6px; }
.escolha { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--linha); border-radius: 8px; cursor: pointer; }
.escolha span { display: grid; }
.escolha small { color: var(--tinta-3); }
.escolha.escolhida { border-color: var(--acento); background: var(--acento-claro); }
.cartao-conferir { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--linha); border-radius: 8px; }

/* ---------------------------------------------------------- folha (modal) */
.folha-fundo { position: fixed; inset: 0; z-index: 40; background: rgb(10 16 14 / 45%); display: flex; justify-content: flex-end; }
.folha {
  width: min(560px, 100%); height: 100%; background: var(--fundo); display: grid; grid-template-rows: auto 1fr auto; box-shadow: var(--sombra);
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.folha-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--linha); background: var(--superficie); }
.folha-corpo { overflow-y: auto; padding: 18px 20px; display: grid; gap: 14px; align-content: start; }
.folha-rodape { padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--linha); background: var(--superficie); }
.folha-menu { height: auto; max-height: 100%; overflow-y: auto; padding: 20px; grid-template-rows: auto; align-self: flex-end; border-radius: 16px 16px 0 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 820px) {
  .folha-fundo { align-items: flex-end; }
  .folha { height: 92%; border-radius: 16px 16px 0 0; padding-top: 0; }
}
