<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulação de isolamento multi-tenant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    linear-gradient(rgba(46,110,142,.35) 1px, transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg, rgba(46,110,142,.35) 1px, transparent 1px) 0 0/48px 48px,
    #0E3A45;
  color:#F7F5F0; font-family:'IBM Plex Sans',sans-serif; padding:60px 24px;
}
.wrap{max-width:700px;margin:0 auto}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;margin-bottom:8px}
.tag{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#C08A3E;margin-bottom:20px;display:block}
.panel{background:#123F4B;border:1px solid rgba(46,110,142,.5);padding:20px}
canvas{width:100%;height:auto;border:1px solid rgba(46,110,142,.5);background:#0F323C}
.caption{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#8FA6AB;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">O CONCEITO POR TRÁS DE TUDO</span>
  <h1>Isolamento multi-tenant via Row-Level Security</h1>
  <div class="panel" style="margin-top:20px">
    <canvas id="sim" width="1200" height="600"></canvas>
    <p class="caption">SIMULAÇÃO AO VIVO — cada bolinha é uma query real de um tenant diferente. Nenhuma cruza pra linha de outro: é isso que o RLS garante no PostgreSQL, na prática, não só na teoria.</p>
  </div>
</div>
<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const w = 600, h = 300;
ctx.scale(2,2);
const COLORS = ["#C08A3E","#5FD3A3","#DD7F35","#8FA6AB"];
const NAMES = ["Loja A","Loja B","Loja C","Loja D"];
let particles = [];
function spawn(tenant){ particles.push({x:20,y:40+tenant*65,vx:1.6+Math.random()*0.6,life:1,tenant}); }
setInterval(()=>spawn(Math.floor(Math.random()*4)), 500);
function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(46,110,142,.4)"; ctx.lineWidth=1;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(0,40+i*65); ctx.lineTo(w,40+i*65); ctx.stroke(); }
  ctx.font="9px JetBrains Mono, monospace";
  NAMES.forEach((n,i)=>{ ctx.fillStyle=COLORS[i]+"aa"; ctx.fillText(n,6,40+i*65-6); });
  ctx.strokeStyle="#C08A3E55"; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(w*0.55,10); ctx.lineTo(w*0.55,h-10); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle="#C08A3E"; ctx.font="8px JetBrains Mono, monospace";
  ctx.fillText("RLS: WHERE tenant_id = current_tenant()", w*0.58, 16);
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x += p.vx; p.life -= 0.004;
    ctx.fillStyle = COLORS[p.tenant] + Math.floor(p.life*255).toString(16).padStart(2,'0');
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
