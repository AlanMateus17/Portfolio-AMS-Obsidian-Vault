<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AM Kaixara</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>/* Layout: trilho de navegação à esquerda + área de trabalho; no balcão, catálogo à esquerda e cupom à direita. Tokens do Aura Design System (Inter + JetBrains Mono, acento latão, grade de 4px). */
:root{
  --bg:#f6f4f0; --surface:#ffffff; --surface-2:#efece6; --line:#e2ddd3; --ink:#1d1b18; --ink-2:#5d5850; --ink-3:#6f695e;
  --accent:#c08a3e; --accent-ink:#7a5420; --accent-soft:#f3e6d1; --on-accent:#1d1408;
  --good:#276b43; --good-soft:#e2f1e7; --warn:#865006; --warn-soft:#fbecd5; --bad:#a5312a; --bad-soft:#f8e1de; --info:#2a5d84; --info-soft:#e0ecf5;
  --shadow:0 1px 2px rgba(40,30,15,.06), 0 8px 24px rgba(40,30,15,.07);
  --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px; --r-lg:12px; --rail:228px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141311; --surface:#1d1b18; --surface-2:#262320; --line:#34302b; --ink:#f1ece4; --ink-2:#b9b1a4; --ink-3:#a39b8d;
  --accent:#d39d4f; --accent-ink:#f0c88a; --accent-soft:#3a2c18; --on-accent:#1d1408;
  --good:#5cb880; --good-soft:#18301f; --warn:#e0a24a; --warn-soft:#352612; --bad:#ef7a6f; --bad-soft:#3a1c19; --info:#76aee0; --info-soft:#15263a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1d1b18; --surface-2:#262320; --line:#34302b; --ink:#f1ece4; --ink-2:#b9b1a4; --ink-3:#a39b8d;
  --accent:#d39d4f; --accent-ink:#f0c88a; --accent-soft:#3a2c18; --on-accent:#1d1408;
  --good:#5cb880; --good-soft:#18301f; --warn:#e0a24a; --warn-soft:#352612; --bad:#ef7a6f; --bad-soft:#3a1c19; --info:#76aee0; --info-soft:#15263a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }
*{box-sizing:border-box}
html,body,#app{height:100%}
#app{display:flex;flex-direction:column}
#app>.app{flex:1;min-height:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
.ico{width:18px;height:18px;flex:none;stroke-width:1.9}
.ico-lg{width:22px;height:22px}
.mut{color:var(--ink-3)} .sm{font-size:12px} .xs{font-size:11px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
/* app shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 15px var(--f-mono)}
.brand b{display:block;font-size:14px} .brand small{color:var(--ink-3);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink-2);width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .badge{margin-left:auto}
.rail-sep{height:1px;background:var(--line);margin:8px 4px}
.rail-foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.opchip{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r);background:var(--surface-2)}

.main{min-width:0;overflow-y:auto;padding-inline:24px;padding-block:20px 40px}
.main.full{padding:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{margin-right:auto}
.banner{background:var(--info-soft);color:var(--info);padding:8px 16px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.treino{background:var(--warn-soft);color:var(--warn)}
@media (max-width:760px){ .banner{padding:6px 16px;font-size:12px} .banner .hide-sm{display:none} .banner .btn{min-height:28px;padding:2px 8px} }
/* elementos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:550;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.big{min-height:52px;font-size:16px;padding:12px 20px}

.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.key:focus-visible,.mesa:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--accent-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.panel>h2,.panel>.ph{margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .ph h2{margin-right:auto}
.grid{display:grid;gap:16px} .g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))} .g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.field{display:grid;gap:4px;font-size:13px;color:var(--ink-2);min-width:0}
.field>span{font-weight:550}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=date],input[type=month],input[type=tel],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-height:38px;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:grid;gap:2px}
.kpi b{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{color:var(--ink-3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.w{background:var(--warn-soft);color:var(--warn)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.i{background:var(--info-soft);color:var(--info)} .pill.a{background:var(--accent-soft);color:var(--accent-ink)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right} td.num{white-space:nowrap}
tr.tot td{font-weight:650;background:var(--surface-2)}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px;font-size:15px}
.alert{padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--good-soft);color:var(--good)} .alert.info{background:var(--info-soft);color:var(--info)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* balcão */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.cat-area{display:flex;flex-direction:column;min-width:0;padding:16px 16px 0;gap:12px;overflow:hidden}
.scan{display:flex;gap:8px;align-items:center}
.scan input{font-size:16px;min-height:46px;padding-left:40px}
.scan .wrap{position:relative;flex:1}
.scan .wrap .ico{position:absolute;left:12px;top:14px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto;padding-bottom:16px;align-content:start}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 10px;cursor:pointer;display:grid;gap:6px;min-height:96px;overflow:hidden}
.tile:hover{border-color:var(--accent)}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--line))}
.tile b{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .preco{font:600 15px var(--f-mono);margin-top:auto}
.tile .est{font-size:11px;color:var(--ink-3)}
.tile .est.low{color:var(--warn)} .tile .est.out{color:var(--bad)}
.tile .var{font-size:11px;color:var(--accent-ink)}
.cupom{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cupom-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cupom-h h2{margin-right:auto}
.itens{flex:1;overflow-y:auto;padding:4px 0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 16px;border-bottom:1px dashed var(--line)}
.item .n{font-weight:550} .item .d{font-size:12px;color:var(--ink-3)}
.item .v{font:600 14px var(--f-mono);text-align:right}
.item .ctl{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:4px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.totais{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:4px;background:var(--surface-2)}

.totais .t{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.totais .t b{font:700 28px var(--f-mono);letter-spacing:-.02em;color:var(--ink)}
.cupom-f{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line)}
.cupom-f .pagar{grid-column:1/-1}
.mobilebar{display:none}
/* mesas */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.mesa{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px;text-align:left;cursor:pointer;min-height:96px;display:grid;gap:4px;align-content:start}
.mesa b{font:700 20px var(--f-mono)}
.mesa.livre{border-style:dashed;color:var(--ink-3)}
.mesa.ocupada{border-color:var(--accent);background:var(--accent-soft)}
.mesa.conta{border-color:var(--info);background:var(--info-soft)}
.mesa .mut{color:var(--ink-2)}
.mesa .v{font:600 13px var(--f-mono)}
/* cozinha */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ticket-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ticket-h b{font:700 18px var(--f-mono)}
.ticket.atraso .ticket-h{background:var(--bad-soft);color:var(--bad)}
.ticket.medio .ticket-h{background:var(--warn-soft);color:var(--warn)}
.tk-item{padding:10px 12px;border-bottom:1px dashed var(--line);display:grid;gap:6px}
.tk-item:last-child{border-bottom:0}
.tk-item .q{font:700 16px var(--f-mono);margin-right:6px}
.tk-item .obs{font-size:12px;color:var(--warn);font-weight:600}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(100%,560px);display:grid;gap:20px}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.opbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:14px 10px;display:grid;justify-items:center;gap:8px;cursor:pointer}
.opbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opbtn .av{width:44px;height:44px;font-size:15px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin-inline:auto;width:100%}
.key{min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);font:600 20px var(--f-mono);cursor:pointer}
.key:active{background:var(--surface-2)}
.pindots{display:flex;gap:10px;justify-content:center;min-height:16px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,12,8,.45);display:grid;place-items:center;padding:16px;z-index:50}

.modal.wide{width:min(100%,860px)}
.modal-h{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h2{margin-right:auto}
.modal-b{padding:16px 20px;display:grid;gap:14px}
.modal-f{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.formas{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.forma{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 8px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-weight:600}
.forma[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.bigval{font:700 30px var(--f-mono);letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);box-shadow:var(--shadow);z-index:80;max-width:min(92vw,560px);font-size:13.5px}
.recibo{font:12.5px/1.5 var(--f-mono);background:var(--surface-2);border-radius:var(--r);padding:14px;white-space:pre-wrap;overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}

.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.mobnav{display:none}
@media (max-width:760px){ .hide-sm{display:none} }
@media (max-width:1100px){ :root{--rail:72px} .rail .t,.brand div,.rail-foot .t,.opchip div{display:none} .nav{justify-content:center;padding:10px} .nav .badge{position:absolute;margin:0;transform:translate(12px,-10px)} .nav{position:relative} .pdv{grid-template-columns:minmax(0,1fr) 360px} }
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .mobnav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
  .mobnav .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;justify-content:center}
  .mobnav .nav .badge{position:absolute;transform:translate(14px,-6px)}
  .main{padding-inline:16px}
  .pdv{grid-template-columns:1fr}

}
@media (prefers-reduced-motion:no-preference){ .tile,.btn,.nav,.chip{transition:border-color .12s,background-color .12s} }

async function sha256(txt){
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }

}

/* ================= armazenamento: banco do artefato ou memória (treinamento) ================= */
function memDb(seed){
  const store = new Map(Object.entries(seed || {}).map(([k, v]) => [k, JSON.parse(JSON.stringify(v))]));
  const subs = new Set(); const leases = new Map();
  let fila = null; const avisar = () => { if (fila) return; fila = setTimeout(() => { fila = null; subs.forEach(f => { try { f(); } catch(e){ console.error(e); } }); }, 0); };

  const merge = (a, b) => { const o = {...a}; for (const [k, v] of Object.entries(b)){ if (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) o[k] = merge(o[k], v); else o[k] = v; } return o; };
  const passa = (x, op, v) => { if (x === undefined) return false; switch(op){ case "==": return x === v; case "!=": return x !== v; case "<": return x < v; case "<=": return x <= v; case ">": return x > v; case ">=": return x >= v; case "in": return v.includes(x); case "not-in": return !v.includes(x); case "array-contains": return Array.isArray(x) && x.includes(v); } return false; };
  function docRef(p){
    return {id:p.split("/").pop(), path:p,
      get: async () => snapDoc(p),
      set: async d => { store.set(p, JSON.parse(JSON.stringify(d))); avisar(); },
      update: async d => { if (!store.has(p)) throw {code:"invalid_argument", message:"documento não existe"}; store.set(p, merge(store.get(p), JSON.parse(JSON.stringify(d)))); avisar(); },
      delete: async () => { store.delete(p); avisar(); },
      acquire: async ({holder, ttlMs = 30000, data}) => { const l = leases.get(p); const t = Date.now(); if (l && l.exp > t && l.holder !== holder) return {acquired:false, expiresAt:new Date(l.exp).toISOString()}; leases.set(p, {holder, exp:t + ttlMs}); if (data) store.set(p, merge(store.get(p) || {}, data)); return {acquired:true, holder, expiresAt:new Date(t + ttlMs).toISOString()}; },
      onSnapshot: (next) => { const f = () => next(snapDoc(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
      collection: c => colRef(p + "/" + c)};
  }
  function query(c, filtros, ord, lim){
    const run = () => { const pre = c + "/"; let ds = [...store.keys()].filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(snapDoc).filter(d => filtros.every(([f, op, v]) => passa(d.data()[f], op, v)));
      if (ord) ds.sort((a, b) => { const x = a.data()[ord[0]], y = b.data()[ord[0]]; return (x > y ? 1 : x < y ? -1 : 0) * (ord[1] === "desc" ? -1 : 1); }); else ds.sort((a, b) => a.id < b.id ? -1 : 1);
      if (lim) ds = ds.slice(0, lim); return {docs:ds, size:ds.length, empty:!ds.length, docChanges:() => [], metadata:{fromCache:false, hasPendingWrites:false}}; };
    return {where:(f, op, v) => query(c, [...filtros, [f, op, v]], ord, lim), orderBy:(f, d) => query(c, filtros, [f, d], lim), limit:n => query(c, filtros, ord, n),
      get: async () => run(), onSnapshot: next => { const f = () => next(run()); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }};
  }
  function colRef(c){ return {...query(c, [], null, 0), path:c, doc: id => docRef(c + "/" + (id || uid())), add: async d => { const r = docRef(c + "/" + uid()); await r.set(d); return r; }}; }
  return {doc:docRef, collection:colRef, _store:store, mem:true};
}

const filaDoc = new Map();
function gravar(path, fn){
  const ant = filaDoc.get(path) || Promise.resolve();
  const p = ant.catch(() => {}).then(fn);
  filaDoc.set(path, p); p.finally(() => { if (filaDoc.get(path) === p) filaDoc.delete(path); });
  return p;
}

function combinarGrade(grade){
  const eixos = Object.entries(grade || {}).map(([k, vs]) => [k, (vs || []).map(v => String(v).trim()).filter(Boolean)]).filter(([, vs]) => vs.length);

  (l.vendas || []).forEach(v => (v.itens || []).forEach(it => (it.mv || []).forEach(m => out.push({p:m[0], q:m[1], tipo:"venda", ts:v.ts, ref:v.id}))));
  (l.eventos || []).forEach(e => (e.mv || []).forEach(m => out.push({p:m[0], q:m[1], tipo:e.tipo, ts:e.ts, ref:e.venda || e.id})));
  (l.movs || []).forEach(m => out.push({p:m.p, q:m.q, tipo:m.tipo, ts:m.ts, ref:m.id, motivo:m.motivo}));

}
function calcularSaldos(base, lotes){

  lotes.filter(l => !ate || (l.dia || "") >= ate).forEach(l => movsDoLote(l).forEach(m => { s[m.p] = r3((s[m.p] || 0) + (Number(m.q) || 0)); }));

/* ---------- venda ---------- */
const totalItem = it => r2((Number(it.q) || 0) * (Number(it.pu) || 0) - (Number(it.desc) || 0));
function totaisVenda(c){
  const itens = (c.itens || []).filter(it => !it.cancelado);
  const sub = r2(sum(itens.map(totalItem)));
  const descItens = r2(sum(itens.map(it => Number(it.desc) || 0)));
  const bruto = r2(sum(itens.map(it => (Number(it.q) || 0) * (Number(it.pu) || 0))));
  const desc = r2(Math.min(sub, c.descTipo === "pct" ? sub * (Number(c.descValor) || 0) / 100 : Number(c.descValor) || 0));
  const taxa = c.taxaServico ? r2((sub - desc) * (Number(c.taxaPct) || 0) / 100) : 0;
  const total = r2(sub - desc + taxa);
  const pago = r2(sum((c.pags || []).map(p => p.v)));
  const falta = r2(Math.max(0, total - pago));
  const excede = r2(Math.max(0, pago - total));
  const dinheiro = r2(sum((c.pags || []).filter(p => p.tipo === "dinheiro").map(p => p.v)));
  const troco = r2(Math.min(excede, dinheiro));
  return {bruto, descItens, sub, desc, descTotal:r2(descItens + desc), taxa, total, pago, falta, excede, troco, invalido: excede - troco > 0.004};
}
/* desconto em % do bruto, para comparar com o limite da pessoa */
const pctDesconto = t => t.bruto > 0 ? r2(t.descTotal / t.bruto * 100) : 0;
/* ---------- caixa: quanto deveria ter em cada forma ---------- */
function esperadoSessao(sessao, lotes, formas){
  const tipoDe = f => (formas.find(x => x.id === f) || {}).tipo || f;
  const e = {}; const add = (f, v) => { e[f] = r2((e[f] || 0) + v); };
  add("dinheiro", Number(sessao.fundo) || 0);
  const meus = lotes.filter(l => l.sessao === sessao.id);
  meus.forEach(l => {
    (l.vendas || []).forEach(v => { (v.pags || []).forEach(p => { if (tipoDe(p.f) !== "fiado") add(p.f, p.v); }); if (v.troco) add("dinheiro", -v.troco); });
    (l.eventos || []).forEach(ev => {
      if (ev.tipo === "sangria") add("dinheiro", -(Number(ev.v) || 0));
      if (ev.tipo === "suprimento") add("dinheiro", Number(ev.v) || 0);
      if (ev.tipo === "recebimento") add(ev.f, Number(ev.v) || 0);
      if (ev.tipo === "cancelamento" || ev.tipo === "devolucao") (ev.reembolso || []).forEach(p => { if (tipoDe(p.f) !== "fiado") add(p.f, -(Number(p.v) || 0)); });
    });
  });
  return e;
}
/* ---------- relatório de vendas de um conjunto de lotes ---------- */
function canceladas(lotes){ const s = new Set(); lotes.forEach(l => (l.eventos || []).forEach(e => { if (e.tipo === "cancelamento" && e.venda) s.add(e.venda); })); return s; }
function resumoVendas(lotes, formas, custos, prods){
  const canc = canceladas(lotes); const tipoDe = f => (formas.find(x => x.id === f) || {}).tipo || f; const taxaDe = f => Number((formas.find(x => x.id === f) || {}).taxa) || 0;
  const vendas = lotes.flatMap(l => (l.vendas || []).map(v => ({...v, sessao:l.sessao, dia:l.dia})));
  const ok = vendas.filter(v => !canc.has(v.id));
  const r = {n:ok.length, nCanc:vendas.length - ok.length, valorCanc:r2(sum(vendas.filter(v => canc.has(v.id)).map(v => v.total))), bruto:0, desc:0, taxaServ:0, total:0, porForma:{}, taxasCartao:0, porProduto:{}, porOp:{}, porHora:{}, porDia:{}, cmv:0, cmvConhecido:true, devolucoes:0};
  ok.forEach(v => {
    r.total = r2(r.total + v.total); r.desc = r2(r.desc + (v.descTotal || 0)); r.taxaServ = r2(r.taxaServ + (v.taxa || 0)); r.bruto = r2(r.bruto + (v.bruto || v.total));
    (v.pags || []).forEach(p => { const val = r2(p.v - (tipoDe(p.f) === "dinheiro" ? Math.min(p.v, v.troco || 0) : 0)); r.porForma[p.f] = r2((r.porForma[p.f] || 0) + val); r.taxasCartao = r2(r.taxasCartao + val * taxaDe(p.f) / 100); });
    const op = v.op || "?"; const o = r.porOp[op] ||= {n:0, total:0}; o.n++; o.total = r2(o.total + v.total);
    const h = new Date(v.ts).getHours(); const ho = r.porHora[h] ||= {n:0, total:0}; ho.n++; ho.total = r2(ho.total + v.total);
    const dd = r.porDia[v.dia] ||= {n:0, total:0}; dd.n++; dd.total = r2(dd.total + v.total);
    (v.itens || []).filter(it => !it.cancelado).forEach(it => { const k = it.p; const pr = r.porProduto[k] ||= {p:k, nome:it.n, q:0, total:0, custo:0};
      pr.q = r3(pr.q + it.q); pr.total = r2(pr.total + totalItem(it));
      if (custos){ const cu = x => Number((custos[x] || {}).medio ?? (custos[x] || {}).custo) || 0; const mv = it.mv || [];
        const semCusto = mv.length ? mv.some(m => !custos[m[0]]) : !custos[it.p]; const c = mv.length ? sum(mv.map(m => -m[1] * cu(m[0]))) : (custos[it.p] ? it.q * cu(it.p) : 0);
        if (semCusto){ r.cmvConhecido = false; pr.semCusto = true; } pr.custo = r2(pr.custo + c); r.cmv = r2(r.cmv + c); } });
  });
  lotes.forEach(l => (l.eventos || []).forEach(e => { if (e.tipo === "devolucao") r.devolucoes = r2(r.devolucoes + sum((e.reembolso || []).map(p => p.v))); }));
  r.liquido = r2(r.total - r.taxasCartao - r.devolucoes);
  r.ticket = r.n ? r2(r.total / r.n) : 0;
  r.ranking = Object.values(r.porProduto).sort((a, b) => b.total - a.total);
  const tot = sum(r.ranking.map(x => x.total)); let acum = 0; r.ranking.forEach(x => { acum += x.total; x.abc = !tot ? "C" : acum / tot <= 0.8 ? "A" : acum / tot <= 0.95 ? "B" : "C"; });
  return r;
}
/* ---------- custo médio ponderado na entrada de mercadoria ---------- */
function novoCustoMedio(saldoAntes, medioAntes, q, custo){
  const s = Math.max(0, Number(saldoAntes) || 0), m = Number(medioAntes), c = Number(custo) || 0;

}
/* ---------- NF-e (XML de compra): fornecedor e itens ---------- */
function lerXmlNFe(xml){
  const doc = new DOMParser().parseFromString(xml, "text/xml"); const t = (el, tag) => el?.getElementsByTagName(tag)[0]?.textContent?.trim() || "";
  const emit = doc.getElementsByTagName("emit")[0]; const ide = doc.getElementsByTagName("ide")[0]; if (!emit) return null;
  const inf = doc.getElementsByTagName("infNFe")[0]; const chave = (inf?.getAttribute("Id") || "").replace(/^NFe/, "");
  const itens = [...doc.getElementsByTagName("det")].map(d => { const p = d.getElementsByTagName("prod")[0];
    const q = Number(t(p, "qCom")) || 0, vProd = Number(t(p, "vProd")) || 0, vDesc = Number(t(p, "vDesc")) || 0, vFrete = Number(t(p, "vFrete")) || 0, vOutro = Number(t(p, "vOutro")) || 0;
    const ipi = Number(t(d.getElementsByTagName("IPI")[0], "vIPI")) || 0, st = Number(t(d.getElementsByTagName("ICMS")[0], "vICMSST")) || 0;
    const totalItem = r2(vProd - vDesc + vFrete + vOutro + ipi + st);
    return {cod:t(p, "cProd"), ean:/^\d{8,14}$/.test(t(p, "cEAN")) ? t(p, "cEAN") : "", nome:t(p, "xProd"), un:t(p, "uCom").toUpperCase(), q, custoUn: q ? r2(totalItem / q) : 0, total:totalItem}; });
  return {fornecedor:t(emit, "xNome"), cnpj:t(emit, "CNPJ"), numero:t(ide, "nNF"), data:t(ide, "dhEmi").slice(0, 10) || t(ide, "dEmi"), chave, itens, total:Number(t(doc.getElementsByTagName("ICMSTot")[0], "vNF")) || r2(sum(itens.map(i => i.total)))};
}

/* consolida o estoque dos dias antigos num saldo inicial, para não precisar ler o histórico todo */

  try {
    const ref = S.db.doc("estoque/base"); const l = await ref.acquire({holder:terminal().id, ttlMs:20000}); if (!l.acquired) return;
    const atual = await ref.get(); const base = atual.exists ? atual.data() : null; if ((base?.ate || "") >= corte) return;

    await ref.set({ate:corte, saldos:saldosNovos, em:agora()});

}

async function conferirPin(pin, filtro){
  if (Date.now() < tentativas.ate) throw new Error("Muitas tentativas. Espere " + Math.ceil((tentativas.ate - Date.now())/1000) + " segundos.");

  const chaves = [...new Set([...Object.keys(esp), ...Object.keys(contado)])].filter(f => formaDe(f).tipo !== "fiado");
  const dif = Object.fromEntries(chaves.map(f => [f, r2((Number(contado[f]) || 0) - (esp[f] || 0))]));
  const fech = {status:"fechada", fechada:agora(), fechadoPor:S.op.id, contado, esperado:esp, diferenca:dif, difTotal:r2(sum(Object.values(dif))), obs:String(obs || "").slice(0, 300)};
  await S.db.doc("sessoes/" + sessao.id).update(fech); S.sessoes[sessao.id] = {...sessao, ...fech};
  if (S.loteLocal?.sessao === sessao.id) S.loteLocal = null;
  return S.sessoes[sessao.id];
}

/* ---------- carrinho ---------- */
function novoCarrinho(){ return {itens:[], descTipo:"valor", descValor:0, pags:[], cliente:"", comanda:null, taxaServico:false, taxaPct:Number(cfg().taxaServico) || 0}; }
function carrinho(){ return S.carrinho ||= novoCarrinho(); }
function addItem(p, q = 1, extra = {}){
  if (!p || !vendavel(p)) return toast("Produto indisponível para venda.");
  const c = carrinho(); const obs = extra.obs || "";
  const ig = c.itens.find(it => it.p === p.id && !it.obs && !obs && Number(it.pu) === Number(p.preco) && !it.desc && p.un === "UN");
  if (ig) ig.q = r3(ig.q + q); else c.itens.push({k:uid(), p:p.id, n:nomeComVariacao(p, S.prods), un:p.un || "UN", q:r3(q), pu:r2(p.preco), desc:0, obs, cozinha:!!p.cozinha});
  S.ultimoItem = p.id; render();
}
/* busca por código: código de barras, código interno ou código de balança (2 + código + peso/valor) */
function porCodigo(cod){
  cod = String(cod || "").trim(); if (!cod) return null;
  const ps = Object.values(S.prods).filter(vendavel);
  const exato = ps.find(p => (p.cod && p.cod === cod) || (p.codigos || []).includes(cod)); if (exato) return {p:exato, q:1};
  if (/^2\d{12}$/.test(cod)){ const ci = cod.slice(1, 6); const p = ps.find(p => String(p.cod || "").replace(/^0+/, "") === ci.replace(/^0+/, "") && p.un === "KG"); if (p){ const valor = Number(cod.slice(6, 12)) / 100; return {p, q:r3(valor / (Number(p.preco) || 1))}; } }
  return null;
}
async function finalizarVenda(){
  const c = carrinho(); const t = totaisVenda(c);
  if (!c.itens.filter(i => !i.cancelado).length) throw new Error("O carrinho está vazio.");
  if (t.falta > 0.004) throw new Error("Falta receber " + brl(t.falta) + ".");
  if (t.invalido) throw new Error("Só dá troco em dinheiro. Ajuste os valores.");
  if (!pode(S.op, "vender") && !(c.comanda && pode(S.op, "comandas"))) sem("vender");
  const sessao = sessaoAberta(); if (!sessao) throw new Error("Abra o caixa antes de vender.");
  const temFiado = c.pags.some(p => p.tipo === "fiado");
  if (temFiado && !c.cliente) throw new Error("Escolha o cliente para vender fiado.");
  let autDesc = null; const pct = pctDesconto(t);
  if (t.descTotal > 0.004){ const lim = m => (Number(m.limiteDesconto) || 0) >= pct - 0.001; const a = await autorizar("desconto", `Desconto de ${brl(t.descTotal)} (${nf(pct, 1)}%)`, lim); if (!a) return null; autDesc = a.auto ? null : a.por; }
  let autFiado = null; if (temFiado){ const a = await autorizar("fiado", `Venda fiado para ${(S.clientes[c.cliente] || {}).nome || "cliente"}`); if (!a) return null; autFiado = a.auto ? null : a.por; }
  const itens = c.itens.filter(i => !i.cancelado).map(it => ({p:it.p, n:it.n, un:it.un, q:r3(it.q), pu:r2(it.pu), desc:r2(it.desc || 0), obs:it.obs || "", mv:movsDaVenda(S.prods[it.p], it.q, S.prods)}));
  const seq = 1 + sum(lotesAtuais().filter(l => l.terminal === terminal().id && l.dia === hojeISO()).map(l => (l.vendas || []).length));
  const v = {id:"v" + uid(), num:terminal().nome.replace(/\D/g, "").slice(0, 2).padStart(2, "0") + "-" + pad(seq, 4), ts:agora(), op:S.op.id, itens,
    bruto:t.bruto, descTotal:t.descTotal, taxa:t.taxa, total:t.total, troco:t.troco, pags:c.pags.map(p => ({f:p.f, v:r2(p.v), tipo:p.tipo, parc:p.parc || undefined})),
    cliente:c.cliente || undefined, comanda:c.comanda || undefined, autDesc:autDesc || undefined, autFiado:autFiado || undefined};
  await gravarNoLote(L => L.vendas.push(v));
  if (temFiado){ const vf = r2(sum(c.pags.filter(p => p.tipo === "fiado").map(p => p.v))); await S.db.collection("fiado").doc("f" + uid()).set({cliente:c.cliente, v:vf, ts:v.ts, venda:v.id, num:v.num, op:S.op.id, dia:hojeISO()}); }
  if (c.comanda){ await tentar(() => S.db.doc("comandas/" + c.comanda).update({status:"paga", paga:agora(), venda:v.id, total:v.total})); }
  S.ultimaVenda = v; S.carrinho = null; return v;
}
async function cancelarVenda(v, motivo){
  const a = await autorizar("cancelarVenda", `Cancelar a venda ${v.num} (${brl(v.total)})`); if (!a) return false;
  const mv = (v.itens || []).flatMap(it => (it.mv || []).map(m => [m[0], -m[1]]));
  const reemb = (v.pags || []).map(p => ({f:p.f, v:r2(p.v - (p.tipo === "dinheiro" ? Math.min(p.v, v.troco || 0) : 0))})).filter(p => p.v > 0);
  await gravarNoLote(L => L.eventos.push({id:uid(), tipo:"cancelamento", ts:agora(), venda:v.id, num:v.num, valor:v.total, mv, reembolso:reemb, motivo:String(motivo || "").slice(0, 160), op:S.op.id, aut:a.auto ? null : a.por}));
  const f = S.fiado.find(x => x.venda === v.id); if (f) await S.db.collection("fiado").doc("f" + uid()).set({cliente:f.cliente, v:-f.v, ts:agora(), venda:v.id, estorno:true, op:S.op.id, dia:hojeISO()});
  return true;
}
async function devolver(v, qtds, formaReemb, motivo){
  if (formaReemb === "credito" && !v.cliente) throw new Error("Para gerar crédito, a venda precisa ter cliente.");
  const a = await autorizar("devolucao", `Troca/devolução da venda ${v.num}`); if (!a) return false;
  const itens = v.itens.map((it, i) => ({it, q:r3(Math.min(Number(qtds[i]) || 0, it.q))})).filter(x => x.q > 0);
  if (!itens.length) throw new Error("Escolha a quantidade a devolver.");
  const valor = r2(sum(itens.map(x => totalItem({...x.it, q:x.q, desc:(x.it.desc || 0) * x.q / x.it.q}))));
  const mv = itens.flatMap(x => (x.it.mv || []).map(m => [m[0], r3(-m[1] * x.q / x.it.q)]));
  const ev = {id:uid(), tipo:"devolucao", ts:agora(), venda:v.id, num:v.num, itens:itens.map(x => ({p:x.it.p, n:x.it.n, q:x.q})), valor, mv, motivo:String(motivo || "").slice(0, 160), op:S.op.id, aut:a.auto ? null : a.por, reembolso: formaReemb === "credito" ? [] : [{f:formaReemb, v:valor}], credito: formaReemb === "credito" ? valor : 0};
  await gravarNoLote(L => L.eventos.push(ev));
  if (formaReemb === "credito"){ await S.db.collection("fiado").doc("f" + uid()).set({cliente:v.cliente, v:-valor, ts:agora(), venda:v.id, credito:true, op:S.op.id, dia:hojeISO()}); }
  return ev;
}

async function salvarProduto(p, custo){
  if (!pode(S.op, "produtos")) sem("produtos");
  const id = p.id || ("p" + uid()); const {id:_, ...corpo} = p;
  corpo.nome = String(corpo.nome || "").trim(); if (!corpo.nome) throw new Error("Dê um nome ao produto.");
  if (corpo.cod){ const dup = Object.values(S.prods).find(x => x.id !== id && (x.cod === corpo.cod || (x.codigos || []).includes(corpo.cod))); if (dup) throw new Error(`O código ${corpo.cod} já é de “${dup.nome}”.`); }
  corpo.preco = r2(corpo.preco); corpo.atualizado = agora();
  await gravar("produtos/" + id, () => S.db.doc("produtos/" + id).set(corpo)); S.prods[id] = {id, ...corpo};
  if (custo != null && isFinite(custo) && pode(S.op, "verCusto")){ const atual = S.custos[id] || {}; await tentar(() => S.db.doc("custos/" + id).set({...atual, custo:r2(custo), medio: atual.medio == null ? r2(custo) : atual.medio, em:agora()})); }
  return id;
}
async function gerarVariacoes(pai, grade, base){
  const combos = combinarGrade(grade); const existentes = Object.values(S.prods).filter(x => x.pai === pai.id);
  let n = 0; for (const attrs of combos){ if (existentes.some(x => JSON.stringify(x.attrs) === JSON.stringify(attrs))) continue;
    await salvarProduto({nome:pai.nome + " " + Object.values(attrs).join(" / "), pai:pai.id, attrs, cat:pai.cat, un:pai.un || "UN", preco:base.preco ?? pai.preco, tipo:"venda", estoque:true, min:base.min || 0, ativo:true, cozinha:false}, base.custo); n++; }
  return n;
}
/* ---------- estoque ---------- */
async function entradaMercadoria({itens, fornecedor, numero, chave, data, frete}){
  if (!pode(S.op, "estoque")) sem("estoque");
  const ts = agora(); const id = "e" + uid(); const sal = saldos();
  const movs = itens.filter(i => i.p && i.q > 0).map(i => ({id:uid(), p:i.p, q:r3(i.q), tipo:"entrada", ts, motivo:dl(fornecedor, numero && "NF " + numero), op:S.op.id, compra:id}));
  if (!movs.length) throw new Error("Nenhum item com produto e quantidade.");
  await gravarMovsEstoque(movs);
  if (pode(S.op, "verCusto")){
    const totalQ = sum(itens.map(i => i.q * (i.custo || 0))) || 1; const fr = Number(frete) || 0;
    for (const i of itens.filter(i => i.p && i.q > 0 && i.custo != null)){ const cu = r2(i.custo + fr * (i.q * i.custo / totalQ) / i.q); const at = S.custos[i.p] || {};
      await tentar(() => S.db.doc("custos/" + i.p).set({...at, custo:cu, medio:novoCustoMedio(sal[i.p] || 0, at.medio ?? at.custo, i.q, cu), em:ts})); }
    await tentar(() => S.db.doc("compras/" + id).set({fornecedor:fornecedor || "", numero:numero || "", chave:chave || "", data:data || hojeISO(), frete:fr, itens:itens.map(i => ({p:i.p, q:i.q, custo:i.custo ?? null, nome:i.nome || ""})), total:r2(sum(itens.map(i => i.q * (i.custo || 0))) + fr), op:S.op.id, ts}));
  }
  return movs.length;
}

    <div class="stack" style="gap:8px"><label class="field"><span>Adicionar produto</span><input type="search" id="busca-com" placeholder="Nome ou código" value="${esc(S.buscaCom || "")}" autocomplete="off"></label>

      ${pend.length ? `<div class="panel" style="padding:10px;background:var(--surface-2)"><div class="lbl" style="margin-bottom:6px">A lançar</div>${pend.map((it, i) => `<div class="row" style="justify-content:space-between;padding:4px 0"><span><b class="num">${qf(it.q)}×</b> ${esc(it.n)}</span><span class="row"><input data-pendobs="${i}" value="${esc(it.obs || "")}" placeholder="observação" style="width:170px;min-height:30px" aria-label="Observação"><span class="qty"><button data-pendq="${i}" data-d="-1">−</button><input value="${qf(it.q)}" readonly aria-label="Quantidade"><button data-pendq="${i}" data-d="1">+</button></span></span></div>`).join("")}<button class="btn pri" data-comenviar="${c.id}" style="margin-top:8px;width:100%">${ico("check")} Lançar ${pend.length} item(ns)${pend.some(it => S.prods[it.p]?.cozinha) && cfg().usaCozinha ? " e mandar para a cozinha" : ""}</button></div>` : ""}

function vCozinha(){

let cozinhaAntes = null;
function avisarCozinha(antes, depois){
  const novos = n => new Set(Object.values(n || {}).flatMap(c => Object.entries(c.itens || {}).filter(([, it]) => it.cozinha && it.st === "novo").map(([k]) => c.id + k)));

/* ---------- caixa ---------- */
function vCaixa(){
  const s = sessaoAberta(); const fs = cfg().formas || FORMAS_PADRAO;
  const outras = Object.values(S.sessoes).filter(x => x.status === "aberta" && x.terminal !== terminal().id);

  let atual = "";
  if (s){
    const lotes = lotesAtuais().filter(l => l.sessao === s.id); const esp = esperadoSessao(s, lotesAtuais(), fs); const vendas = lotes.flatMap(l => l.vendas || []); const evs = lotes.flatMap(l => l.eventos || []);

      <div class="kpis"><div class="kpi"><span class="lbl">Vendas</span><b>${validas.length}</b><small>${brl(sum(validas.map(v => v.total)))}</small></div><div class="kpi"><span class="lbl">Dinheiro na gaveta</span><b>${brl(esp.dinheiro || 0)}</b><small>troco inicial ${brl(s.fundo)}</small></div>
        ${Object.entries(esp).filter(([f]) => f !== "dinheiro").map(([f, v]) => `<div class="kpi"><span class="lbl">${esc(formaDe(f).nome)}</span><b>${brl(v)}</b></div>`).join("")}</div>
      <div class="row"><button class="btn" data-modal="sangria">${ico("arrow-left-right")} Sangria</button><button class="btn" data-modal="suprimento">${ico("plus")} Reforço de troco</button><button class="btn pri" data-modal="fecharCaixa">${ico("lock")} Fechar caixa</button></div>
      ${evs.filter(e => e.tipo !== "abertura").length ? `<div class="tbl"><table><thead><tr><th>Hora</th><th>Movimento</th><th class="r">Valor</th><th>Quem</th></tr></thead><tbody>${evs.filter(e => e.tipo !== "abertura").slice().reverse().map(e => `<tr><td class="num">${hora(e.ts)}</td><td>${esc({sangria:"Sangria", suprimento:"Reforço de troco", cancelamento:"Cancelamento da venda " + (e.num || ""), devolucao:"Devolução da venda " + (e.num || ""), recebimento:"Recebimento de fiado: " + (S.clientes[e.cliente]?.nome || "")}[e.tipo] || e.tipo)}${e.motivo ? `<div class="xs mut">${esc(e.motivo)}</div>` : ""}</td><td class="r num">${brl(e.v ?? e.valor)}</td><td>${esc(nomeMembro(e.op))}${e.aut ? `<div class="xs mut">autorizado por ${esc(nomeMembro(e.aut))}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </section>`;
  } else if (pode(S.op, "caixa")) atual = `<section class="panel stack"><h2>Caixa fechado neste aparelho</h2><p class="mut">Conte o dinheiro que está na gaveta para troco e abra o caixa.</p><div><button class="btn pri big" data-modal="abrirCaixa">${ico("wallet")} Abrir caixa</button></div></section>`;
  return `<div class="topbar"><h1>Caixa</h1><label class="field" style="max-width:220px"><span class="sm">Nome deste aparelho</span><input id="term-nome" value="${esc(terminal().nome)}" maxlength="20"></label></div>

    ${outras.length ? `<section class="panel"><h2>Abertos em outros aparelhos</h2><div class="tbl"><table><thead><tr><th>Aparelho</th><th>Quem</th><th>Desde</th><th></th></tr></thead><tbody>${outras.map(x => `<tr><td>${esc(x.terminalNome || x.terminal)}</td><td>${esc(nomeMembro(x.operador))}</td><td class="num">${dataHoraBR(x.aberta)}</td><td class="r">${pode(S.op, "verCaixas") ? `<button class="btn sm" data-fecharoutro="${x.id}">Fechar à distância</button>` : ""}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    ${recentes.length && (pode(S.op, "verCaixas") || recentes.some(x => x.operador === S.op.id)) ? `<section class="panel"><h2>Fechamentos recentes</h2><div class="tbl"><table><thead><tr><th>Dia</th><th>Aparelho</th><th>Quem</th><th class="r">Esperado</th><th class="r">Contado</th><th class="r">Diferença</th><th></th></tr></thead><tbody>${recentes.filter(x => pode(S.op, "verCaixas") || x.operador === S.op.id).map(x => `<tr><td class="num">${dataBR(x.dia)}</td><td>${esc(x.terminalNome || "")}</td><td>${esc(nomeMembro(x.operador))}</td><td class="r num">${brl(sum(Object.entries(x.esperado || {}).filter(([f]) => formaDe(f).tipo !== "fiado").map(([, v]) => v)))}</td><td class="r num">${brl(sum(Object.values(x.contado || {})))}</td><td class="r num ${Math.abs(x.difTotal || 0) < 0.01 ? "" : x.difTotal > 0 ? "pos" : "neg"}">${brl(x.difTotal)}</td><td class="r"><button class="btn sm ghost" data-relz="${x.id}">Ver</button></td></tr>`).join("")}</tbody></table></div></section>` : ""}
    </div>`;

function vAbrirCaixa(){ return modal("Abrir caixa", `<label class="field"><span>Dinheiro na gaveta para troco</span><input id="fundo" inputmode="decimal" placeholder="0,00" autofocus></label><p class="mut sm">Conte as notas e moedas antes de abrir. Esse valor é o ponto de partida da conferência no fechamento.</p>`, `<button class="btn" data-fechar>Cancelar</button><button class="btn pri" data-abrircaixa>Abrir caixa</button>`); }

function relatorioZ(x){

function vProdutos(){
  const q = normTxt(S.buscaProd || ""); const f = S.filtroProd || "";
  const sal = saldos(); const verCusto = pode(S.op, "verCusto"); const edita = pode(S.op, "produtos");
  let ps = listaProds().filter(p => !p.pai);
  if (q) ps = ps.filter(p => normTxt(p.nome).includes(q) || (p.cod || "").includes(S.buscaProd.trim()));
  if (f === "inativos") ps = ps.filter(p => p.ativo === false); else ps = ps.filter(p => p.ativo !== false);

async function carregarRel(){

  render();
}

async function autorizarPin(silencioso){

async function salvarMembroForm(){

/* planilha de produtos */
async function lerPlanilhaProdutos(file){
  await lib("xlsx"); const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), {type:"array"}); const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:""}); if (!rows.length) throw new Error("A planilha está vazia.");
  const col = (r, ...nomes) => { for (const k of Object.keys(r)) if (nomes.includes(normTxt(k).replace(/[^a-z]/g, ""))) return r[k]; return ""; };
  return rows.map(r => { const nome = String(col(r, "nome", "produto", "descricao")).trim(); if (!nome) return null; const cod = String(col(r, "codigo", "cod", "ean", "codigodebarras", "sku")).trim();
    const preco = num(col(r, "preco", "precovenda", "valor", "precodevenda")); const custo = num(col(r, "custo", "precocusto", "precodecusto")); const est = num(col(r, "estoque", "saldo", "quantidade", "qtd")); const min = num(col(r, "minimo", "estoqueminimo"));
    const ex = Object.values(S.prods).find(p => (cod && p.cod === cod) || normTxt(p.nome) === normTxt(nome));
    return {nome, cod, cat:String(col(r, "categoria", "grupo")).trim(), un:String(col(r, "unidade", "un")).trim().toUpperCase(), preco:isFinite(preco) ? r2(preco) : 0, custo:isFinite(custo) ? r2(custo) : null, estoque:isFinite(est) ? est : null, min:isFinite(min) ? min : 0, existe:ex?.id || null}; }).filter(Boolean).slice(0, 1000);
}
async function importarLinhasProdutos(linhas){
  const c = JSON.parse(JSON.stringify(cfg())); let mudouCat = false;
  const catId = nome => { if (!nome) return (c.categorias[0] || {}).id; let k = c.categorias.find(x => normTxt(x.nome) === normTxt(nome)); if (!k){ k = {id:"c" + uid(), nome, cor:COR_AV[c.categorias.length % COR_AV.length]}; c.categorias.push(k); mudouCat = true; } return k.id; };
  linhas.forEach(l => { l.catId = catId(l.cat); });
  if (mudouCat) await S.db.doc("config/loja").set(c);
  let n = 0; const contagem = {};
  for (const l of linhas){ const base = l.existe ? {...S.prods[l.existe]} : {tipo:"venda", estoque:true, ativo:true};
    const id = await salvarProduto({...base, id:l.existe || undefined, nome:l.nome, cod:l.cod || base.cod || "", cat:l.cat ? l.catId : (base.cat || l.catId), un:UNIDADES[l.un] ? l.un : (base.un || "UN"), preco:l.preco || base.preco || 0, min:l.min || base.min || 0}, l.custo);
    if (l.estoque != null) contagem[id] = l.estoque; n++; }
  if (Object.keys(contagem).length && pode(S.op, "estoque")) await aplicarInventario(contagem);
  toast(`${n} produto(s) importado(s).`);
}

(async function iniciar(){
  document.documentElement.lang = "pt-BR";
  try { const t = lsGet("kx-tema", null); if (t) document.documentElement.dataset.theme = t; } catch(e){}
  render();
  const usar = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user] = await Promise.all([usar("db"), usar("user")]);
  if (!db){ S.modo = "treino"; await iniciarTreino(); toast("Este aparelho não está ligado ao banco do sistema; abrimos o modo treinamento."); return; }

  }, 30000);

})();
