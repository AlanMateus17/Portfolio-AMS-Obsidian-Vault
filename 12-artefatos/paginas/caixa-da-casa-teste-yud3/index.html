async function exportar(){
  const linhas = [["data","loja","cnpj","numero","item","codigo","qtde","unidade","valor","categoria","essencial","de_quem","pago_por"]];
  const nome = id => id==="casa" ? "Casa" : (S.familia.pessoas.find(p=>p.id===id)?.nome || id);
  S.notas.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(n => (n.itens||[]).forEach(it => linhas.push([n.data.slice(0,10), n.emitente, n.cnpj, n.numero, it.d, it.c, String(it.q).replace(".",","), it.u, String(it.v).replace(".",","), it.cat, CATS[it.cat]?"sim":"não", nome(it.esc), nome(n.pagoPor)])));
  const csv = "﻿" + linhas.map(l => l.map(c => `"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  try { await S.downloads.save({filename:"caixa-da-casa.csv", data:new Blob([csv],{type:"text/csv"})}); } catch(e){ if (e?.code !== "cancelled" && e?.code !== "declined") toast("O download não foi concluído."); }
}

/* ================= inicialização ================= */
/* v24: os dados chegam em partes (cada consulta do banco entrega no máximo 1000 documentos), e a tela é redesenhada uma vez por rodada */
let renderPendente = false;
function renderLogo(){ if (renderPendente) return; renderPendente = true; setTimeout(() => { renderPendente = false; render(); }, 25); }
/* junta as partes sem repetir: as partes vivas (as de cada período) valem mais que as “extras” */
const juntarPartes = (partes, extras) => { const m = new Map(); (extras||[]).forEach(x => m.set(x.id, x)); Object.values(partes).forEach(arr => (arr||[]).forEach(x => m.set(x.id, x))); return [...m.values()]; };
const TIPOS_VOLUME = ["operacao","lancVeiculo"];
function conectarDados(db){
  const gen = S.gen = (S.gen||0) + 1; const ok = () => S.gen === gen; const R = () => { if (ok()) renderLogo(); };
  /* até todas as partes chegarem pela 1ª vez, a tela mostra “carregando” e nada pode ser gravado (evita duplicar ou apagar pela metade) */
  const espera = new Set(); S.carregado = false;
  const chegou = k => { if (!espera.has(k)) return; espera.delete(k); if (!espera.size && ok()){ S.carregado = true; R(); } };
  const fail = k => err => { if (!ok()) return; chegou(k); toast("Conexão com os dados interrompida ("+(err?.code||"erro")+"). Recarregue a página."); };
  const ouvir = (k, ref, cb) => { espera.add(k); ref.onSnapshot(s => { if (!ok()) return; cb(s); chegou(k); }, fail(k)); };
  setTimeout(() => { if (ok() && !S.carregado){ S.carregado = true; toast("Alguns dados demoraram para chegar. Confira a internet; se algo faltar, recarregue a página."); R(); } }, 20000);
  S.limiteCheio = {}; const cheio = (k, nome, n, lim) => { if (n >= lim){ if (!S.limiteCheio[k]){ S.limiteCheio[k] = nome; toast("Muitos registros em “"+nome+"”: alguns podem não aparecer. Me avise para ampliar o limite."); } } else delete S.limiteCheio[k]; };
  const docs = s => s.docs.map(d => ({id:d.id, ...d.data()}));
  ouvir("familia", db.doc("config/familia"), s => { const d = s.data() || {}; S.familia = {pessoas: Array.isArray(d.pessoas)?d.pessoas:[], ipca: d.ipca || {}, ...(d.divisao ? {divisao:d.divisao} : {})}; R(); });
  ouvir("dic", db.doc("config/dicionario"), s => { S.dic = s.data()?.map || {}; });
  ouvir("orc", db.doc("config/orcamento"), s => { S.orcamento = s.data()?.limites || {}; R(); });
  ouvir("rendas", db.collection("rendas").limit(1000), s => { const r = {}; s.docs.forEach(d => r[d.id] = d.data()); S.rendas = r; cheio("rendas", "rendas da casa", s.docs.length, 1000); R(); });
  ouvir("acertos", db.collection("acertos").limit(1000), s => { S.acertos = docs(s); cheio("acertos", "acertos", s.docs.length, 1000); R(); });
  ouvir("casa", db.collection("casa").limit(1000), s => { S.casa = docs(s).filter(x => x.tipo === "contaCasa"); cheio("casa", "contas da casa", s.docs.length, 1000); R(); });
  // notas: uma consulta por semestre (de 6 anos atrás até o ano que vem) e uma geral para as que ficam fora dos semestres
  const ano = Number(MES_ATUAL.slice(0,4)); const iniN = (ano - 6)+"-01", fimN = (ano + 2)+"-01"; const partesN = {}; let extrasN = [];
  const atualizaNotas = () => { S.notas = juntarPartes(partesN, extrasN).filter(n => n.data); R(); };
  for (let y = ano - 6; y <= ano + 1; y++) [[y+"-01", y+"-07"], [y+"-07", (y+1)+"-01"]].forEach(([a, b]) =>
    ouvir("n"+a, db.collection("notas").where("mes", ">=", a).where("mes", "<", b).limit(1000), s => { partesN[a] = docs(s); cheio("n"+a, "notas de "+(a.endsWith("01") ? "jan a jun" : "jul a dez")+" de "+a.slice(0,4), s.docs.length, 1000); atualizaNotas(); }));
  ouvir("nExtra", db.collection("notas").limit(1000), s => { extrasN = docs(s).filter(n => !(typeof n.mes === "string" && n.mes >= iniN && n.mes < fimN)); atualizaNotas(); });
  if (S.uid){
    const col = db.collection("data/users/"+S.uid); const partesP = {}; let extrasP = [];
    const atualizaCad = () => { S.cad = juntarPartes(partesP, extrasP).filter(x => x.tipo && TYPES[x.tipo]); R(); };
    ouvir("param", col.doc("parametros"), s => { const x = s.data(); S.param = x ? {...JSON.parse(JSON.stringify(PARAM_PADRAO)), ...x} : null; R(); });
    ouvir("rotina", col.doc("rotina"), s => { S.rotina = s.data() || null; R(); });
    // pagamentos marcados ficam numa consulta só deles: as outras partes nunca mexem em S.pag (não desfazem um clique que ainda está sendo gravado)
    ouvir("pag", col.where("tipo", "==", "pagamentos").limit(1000), s => { const pag = {}, sIni = {}; docs(s).forEach(x => { if (!x.mes) return; pag[x.mes] = x.itens || {}; if (x.saldoInicial !== undefined && x.saldoInicial !== null) sIni[x.mes] = x.saldoInicial; }); S.pag = pag; S.saldoIni = sIni; cheio("pag", "contas pagas", s.docs.length, 1000); R(); });
    ouvir("cad", col.where("tipo", "not-in", [...TIPOS_VOLUME, "holerite", "extrato", "pagamentos"]).limit(1000), s => { partesP.cad = docs(s); cheio("cad", "cadastros", s.docs.length, 1000); atualizaCad(); });
    ["holerite","extrato"].forEach(t => ouvir(t, col.where("tipo", "==", t).limit(1000), s => { partesP[t] = docs(s); cheio(t, t === "holerite" ? "contracheques" : "extratos", s.docs.length, 1000); atualizaCad(); }));
    const iniV = (ano - 6)+"-01-01", fimV = (ano + 2)+"-01-01";
    TIPOS_VOLUME.forEach(t => { for (let y = ano - 6; y <= ano + 1; y++) ouvir(t+y, col.where("tipo", "==", t).where("data", ">=", y+"-01-01").where("data", "<", (y+1)+"-01-01").limit(1000), s => { partesP[t+y] = docs(s); cheio(t+y, (t === "operacao" ? "operações de " : "lançamentos de veículo de ")+y, s.docs.length, 1000); atualizaCad(); }); });
    // operações e lançamentos antigos ou com data fora do padrão: consulta geral, filtrada aqui
    ouvir("pExtra", col.where("tipo", "in", TIPOS_VOLUME).limit(1000), s => { extrasP = docs(s).filter(x => !(typeof x.data === "string" && x.data >= iniV && x.data < fimV)); atualizaCad(); });
  }
  render();
}

(async function boot(){
  try { document.documentElement.lang = "pt-BR"; } catch(e){}
  render();
  const c = window.claude;
  const [db, sample, downloads, user] = c ? await Promise.all(["db","sample","downloads","user"].map(n => c.use(n).catch(()=>null))) : [null,null,null,null];
  S.db = db; S.sample = sample; S.downloads = downloads;
  try { S.uid = user ? await user.id() : null; } catch(e){ S.uid = null; }
  S.ready = true;
  let real = false; try { real = location.hash === "#real" || sessionStorage.getItem("caixaReal") === "1"; } catch(e){ real = location.hash === "#real"; }
  if (!real){ entrarModoTeste(); S.tab = "roteiro"; render(); return; }
  if (!db){ render(); return; }
  conectarDados(db);
  render();
})();
</script>
