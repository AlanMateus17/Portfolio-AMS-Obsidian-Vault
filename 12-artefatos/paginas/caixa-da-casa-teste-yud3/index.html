/* Layout: livro-caixa pessoal e da família — régua de abas no topo, painéis em grade que viram uma coluna no celular; números em mono como num cupom */

function calcINSS(bruto){
  const f = P().inss.faixas; let ant = 0, tot = 0;
  for (const [lim, al] of f){ if (bruto <= ant) break; const ate = Math.min(bruto, lim); tot += (ate-ant) * al/100; ant = lim; }
  return Math.round(tot*100)/100;
}
function tabelaIR(base){
  for (const [lim, al, ded] of P().irrf.faixas){ if (lim === null || base <= lim) return Math.max(0, base*al/100 - ded); }
  return 0;
}
function calcIR(bruto, deducoesLegais){
  const t = P().irrf;
  const base = bruto - Math.max(deducoesLegais, t.simplificado);
  let ir = tabelaIR(base), red = 0;
  if (bruto <= t.reducaoAte) red = Math.min(t.reducaoMax, ir);
  else if (bruto <= t.reducaoLimite) red = Math.min(ir, Math.max(0, t.reducaoA - t.reducaoB*bruto));
  return {ir:Math.round((ir-red)*100)/100, semReducao:Math.round(ir*100)/100, base};
}
function aliqRF(dias){ for (const [lim, al] of P().rfIR) if (lim === null || dias <= lim) return al/100; return .15; }

async function salvarQuemPagouNota(id, limpar){

function participantes(){ return S.familia.pessoas.filter(p => p.rateio !== false && !(Number(p.contribFixa) > 0)); }
function pesosRenda(m){

function pesosFixos(txt){

function dividir(c, v, m){
  if (modoPago()){ const pg = c.pagos?.[m]; const q0 = pg?.por || (m > MES_ATUAL ? (c.pagoPor || c.responsavel) : "");
    if (pg && Array.isArray(pg.partes)){ const o = {}; let us = 0; pg.partes.forEach(pp => { const x = Number(pp.valor)||0; o[pp.por] = (o[pp.por]||0) + x; us += x; }); if (v - us > 0.005 && q0) o[q0] = (o[q0]||0) + v - us; return o; }
    return q0 ? {[q0]: v} : {}; }
  let w = {};

}

function fixosCasa(){ return (S.familia?.pessoas||[]).filter(p => p.rateio !== false && Number(p.contribFixa) > 0); }

  const ps = S.familia.pessoas; const normC = pid => sum(contasCasa.map(x => x.partes[pid]||0)); const out = {};

  ps.forEach(p => out[p.id] = {contas:normC(p.id), notas:casaNotas*(w[p.id]||0)});
  const fix = fixosCasa(); if (!fix.length) return out;
  const contasLiq = sum(contasCasa.map(x => x.v)); let fixT = 0;
  fix.forEach(p => { const f = Number(p.contribFixa); out[p.id] = {contas:f, notas:0, fixa:f}; fixT += f; }); // a contribuição inteira aparece como uma conta só, todo mês
  const outros = ps.filter(p => !fix.includes(p) && p.rateio !== false); const sC = sum(outros.map(p => normC(p.id))), sW = sum(outros.map(p => w[p.id]||0));
  outros.forEach(p => { out[p.id] = {contas:(contasLiq - fixT)*(sC > 0.005 ? normC(p.id)/sC : 1/outros.length), notas:casaNotas*(sW > 0 ? (w[p.id]||0)/sW : 1/outros.length)}; });
  return out;
}

async function pdfTexto(file){

  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let s = "";

  return s;
}
function parseNFCe(t){
  const re = /([^\n]*?)\s*\(C[óo]digo:\s*(\d+)\)\s*Qtde total de [íi]tens:\s*([\d.,]+)\s*UN:\s*([A-Za-z]+)\s*Valor total R\$:\s*R\$\s*([\d.,]+)/g;
  const itens = []; let m;
  while ((m = re.exec(t))) itens.push({d:m[1].replace(/Filtar [íi]tens\.*/i,"").trim(), c:m[2], q:parseFloat(m[3]), u:m[4].toUpperCase(), v:toNum(m[5])});
  const g = r => { const x = t.match(r); return x ? x[1] : null; };
  const mm = t.match(/Data Emiss[ãa]o\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2})/);
  const pags = [...t.matchAll(/Valor pago R\$\s+([\d.,]+)\s+Forma de Pagamento\s+\d+\s*-\s*([^\n]+?)\s*(?=Valor pago|\n|$)/g)].map(x=>({forma:x[2].trim(), valor:toNum(x[1])}));
  const tot = g(/Valor total R\$\s+([\d.,]+)/);
  const icms = t.match(/Valor ICMS\s+R\$\s*([\d.,]+)\s+R\$\s*([\d.,]+)\s+R\$\s*([\d.,]+)/);
  const trib = g(/[Tt]ributos[^\n]{0,60}?R\$\s*([\d.,]+)/);
  return {
    emitente: (g(/\(NFC-e\)\s*\n\s*([^\n]+?)\s*\n/) || "").trim(),
    cnpj: g(/CNPJ:\s*(\d{14})/) || "", serie: mm ? mm[2] : "", numero: mm ? mm[3] : "",
    data: mm ? `${mm[6]}-${mm[5]}-${mm[4]}T${mm[7]}` : "",
    total: tot ? toNum(tot) : sum(itens.map(x=>x.v)),
    icmsBase: icms ? toNum(icms[2]) : null, icms: icms ? toNum(icms[3]) : null, tributosAprox: trib ? toNum(trib) : null,
    pags, itens
  };
}

function memDb(store){
  const subs = []; const notify = () => setTimeout(() => subs.slice().forEach(f => { try { f(); } catch(e){ console.error(e); } }), 0);
  const snap = p => ({id:p.split("/").pop(), exists: p in store, data: () => store[p] ? JSON.parse(JSON.stringify(store[p])) : undefined});
  const docRef = p => ({ set: async d => { store[p] = JSON.parse(JSON.stringify(d)); notify(); }, update: async d => { store[p] = {...(store[p]||{}), ...JSON.parse(JSON.stringify(d))}; notify(); }, delete: async () => { delete store[p]; notify(); }, get: async () => snap(p),
    onSnapshot: cb => { const f = () => cb(snap(p)); subs.push(f); setTimeout(f, 0); return () => {}; } });
  const passa = (x, op, v) => { if (x === undefined) return false; switch (op){ case "==": return x === v; case "!=": return x !== null && x !== v; case "<": return x < v; case "<=": return x <= v; case ">": return x > v; case ">=": return x >= v; case "in": return v.includes(x); case "not-in": return x !== null && !v.includes(x); case "array-contains": return Array.isArray(x) && x.includes(v); } return false; };
  const consulta = (c, fs, lim) => { const run = () => { let ds = Object.keys(store).filter(k => k.startsWith(c+"/") && !k.slice(c.length+1).includes("/")).sort().map(snap).filter(d => fs.every(([f, op, v]) => passa(store[c+"/"+d.id]?.[f], op, v))); if (lim) ds = ds.slice(0, lim); return {docs:ds, size:ds.length, empty:!ds.length}; };
    return { doc: id => docRef(c+"/"+id), where: (f, op, v) => consulta(c, [...fs, [f, op, v]], lim), limit: n => consulta(c, fs, n), orderBy: () => consulta(c, fs, lim), get: async () => run(),
      onSnapshot: cb => { const f = () => cb(run()); subs.push(f); setTimeout(f, 0); return () => {}; } }; };
  const colRef = c => consulta(c, [], 0);;
  return {collection:colRef, doc:docRef};
}

async function comecarDoZero(casaTambem){

    if (casaTambem){
      for (const x of (S.notas||[])) { await S.db.collection("notas").doc(x.id).delete(); n++; }
      for (const x of (S.casa||[])) { await S.db.collection("casa").doc(x.id).delete(); n++; }
      for (const x of (S.acertos||[])) { await S.db.collection("acertos").doc(x.id).delete(); n++; }
      for (const k of Object.keys(S.rendas||{})) { await S.db.collection("rendas").doc(k).delete(); n++; }
    }
    S.saldoIni = {}; toast(`${n} registro(s) apagado(s). Pronto para começar do zero.`);
  } catch(e){ toast(errMsg(e)); }
  S.zero = null; S.busy = ""; render();
}

async function gravarImport(){
  const d = S.importInv; if (!d || S.gravandoImport) return; const cart = d.cart || ""; const simulada = cartPorId(cart).modo === "simulada";
  marcarDup(d); S.gravandoImport = true; S.busy = "Gravando os investimentos…"; render(); let nOps = 0, nAt = 0, nPos = 0;
  try {
    const invDe = nome => comCarteira(cart, () => meuCad("investimento")).find(i => donoDe(i) === eu() && normNome(i.nome) === normNome(nome));
    const garantir = async (x, extra) => { let inv = invDe(x.nome); if (inv) return inv;
      inv = {id:"cad-investimento-"+uid(), tipo:"investimento", carteira:cart, nome:x.nome, produto:x.produto, classe:x.classe, quantidade:0, instituicao:x.instituicao||"", pessoa:eu(), ...extra};
      await salvarCadastro(inv, true); S.cad = [...S.cad, inv]; nAt++;
      if ((PROD[x.produto]||{}).g === "rv" && ["acao","fii","fiagro","bdr","etf","exterior"].includes(x.produto) && !meuCad("analise").some(a => normNome(a.nome) === normNome(x.nome))){
        const an = {id:"cad-analise-"+uid(), tipo:"analise", nome:x.nome, tipoAtivo: ["fii","fiagro"].includes(x.produto) ? "fii" : ["bdr","exterior"].includes(x.produto) ? "ext" : "acao", situacao: simulada ? "estudando" : "carteira", preco:x.precoAtual || x.preco || 0, dataPreco:hojeISO(), pessoa:eu()};
        await salvarCadastro(an, true); S.cad = [...S.cad, an]; }
      return inv; };
    if (d.modoManual === "somar"){ const conv = new Set(); for (const o of d.ops.filter(o => !o.dup)){ const inv = invDe(o.nome); if (!inv || conv.has(inv.id) || posicaoOps(inv)) continue; conv.add(inv.id); const rv = (PROD[inv.produto]||{}).g === "rv";
        const ini = rv ? (Number(inv.quantidade) > 0 ? {op:"compra", quantidade:Number(inv.quantidade), preco:Number(inv.precoMedio)||0, valor:Math.round(Number(inv.quantidade)*(Number(inv.precoMedio)||0)*100)/100} : null) : (Number(inv.aplicado) > 0 ? {op:"aporte", valor:Number(inv.aplicado)} : null);
        if (ini) await salvarCadastro({tipo:"operacao", carteira:cart, nome:inv.nome, data:inv.dataAplic || addMesesData(o.data, -1), classe:inv.classe, instituicao:inv.instituicao||"", pessoa:donoDe(inv), obs:"Posição que estava digitada, antes da importação.", ...ini}, true); } }
    for (const o of d.ops.filter(o => !o.dup)){ const inv = await garantir(o, {precoAtual:o.preco || 0});
      await salvarCadastro({tipo:"operacao", carteira:cart, nome:inv.nome, data:o.data, op:o.op, classe:inv.classe, quantidade:o.quantidade || null, preco:o.preco || null, valor:o.valor, instituicao:o.instituicao || inv.instituicao || "", pessoa:donoDe(inv), obs:[o.origem, o.obs].filter(Boolean).join(" · ")}, true); nOps++; }
    for (const p of d.posicoes){ const inv = await garantir(p, {}); const atual = invDe(p.nome) || inv; const temOps = posicaoOps(atual); const rv = (PROD[atual.produto]||{}).g === "rv";
      if (rv && !p.precoAtual && p.valorAtual > 0){ if (p.quantidade > 0) p.precoAtual = p.valorAtual/p.quantidade; else { p.quantidade = 1; p.precoAtual = p.valorAtual; } }
      const upd = {...atual}; if (rv && p.precoAtual) upd.precoAtual = p.precoAtual;
      if (!temOps){ if (rv){ if (p.quantidade) upd.quantidade = p.quantidade; if (p.precoMedio) upd.precoMedio = p.precoMedio; else if (!(Number(upd.precoMedio) > 0) && p.precoAtual) { upd.precoMedio = p.precoAtual; upd.obs = [upd.obs, "Preço médio desconhecido na importação da posição: importe as negociações para o resultado ficar certo."].filter(Boolean).join(" "); } }
        else { if (p.aplicado || p.valorAtual) upd.aplicado = p.aplicado || p.valorAtual; if (p.vencimento) upd.vencimento = p.vencimento; } }
      if (!rv && p.valorAtual > 0){ upd.valorInformado = p.valorAtual; upd.dataValorInf = hojeISO(); }
      await salvarCadastro(upd, true); nPos++;
      const an = meuCad("analise").find(a => normNome(a.nome) === normNome(p.nome)); if (an && p.precoAtual) await salvarCadastro({...an, preco:p.precoAtual, dataPreco:hojeISO()}, true); }

  } catch(e){ toast(errMsg(e)); }
  finally { S.gravandoImport = false; S.busy = null; render(); }
}

const valorCasaNota = n => sum((n.itens||[]).filter(it => it.esc === "casa").map(it => Number(it.v)||0));
/* o que pode ter sido pago com o dinheiro entregue: contas e compras da casa do mês ainda sem pagamento confirmado, ou confirmadas como pagas por quem recebeu o dinheiro */
function candidatosAporte(m, para){
  const cs = contasCasaMes(m).filter(x => !x.receita && x.v > 0.005).filter(x => { const pg = x.c.pagos?.[m]; return !pg || (!pg.partes && pg.por === para && !pg.aporte); })
    .map(x => ({tipo:"conta", id:x.c.id, nome:x.c.nome, v:x.v, ord:"0"+String(Number(x.c.dia)||31).padStart(2,"0"), det: x.c.dia ? "vence dia "+x.c.dia : "conta da casa"}));
  const ns = notasDoMes(m).filter(n => !n.aporte && !n.pagoPartes && (!n.pagoPor || n.pagoPor === para)).map(n => ({tipo:"nota", id:n.id, nome:"Compra em "+(n.emitente||"loja"), v:valorCasaNota(n), ord:"1"+String(n.data||""), det:dataBR(String(n.data||"").slice(0,10))})).filter(x => x.v > 0.005);
  return [...cs, ...ns].sort((a,b) => a.ord.localeCompare(b.ord));
}
/* distribui o valor pelos itens marcados, na ordem (contas pelo vencimento, depois compras pela data) */
function distribuirAporte(valor, itens, marcados){
  let resto = valor; const out = itens.map(it => { const usa = marcados.has(it.tipo+":"+it.id) && resto > 0.005 ? Math.min(resto, it.v) : 0; resto -= usa; return {...it, usa:Math.round(usa*100)/100}; });
  return {itens:out, sobra:Math.max(0, Math.round(resto*100)/100)};
}
function vAporteCasa(m){
  const a = S.aporteCasa; if (!a) return "";
  const its = candidatosAporte(m, a.para); if (!a.marcados) a.marcados = new Set(its.map(it => it.tipo+":"+it.id)); const d = distribuirAporte(a.valor, its, a.marcados);
  return `<div class="panel" style="margin-top:10px;border:2px solid var(--line)"><h3 style="margin-top:0">${esc(nomePessoa(a.de))} entregou ${brl(a.valor)} para ${esc(nomePessoa(a.para))} em ${mesLabel(m)}</h3>
    <p class="note">O sistema sugere em que esse dinheiro foi usado: as contas da casa pela ordem de vencimento e depois as compras, entre o que ainda não tinha pagamento confirmado ou estava como pago por ${esc(nomePessoa(a.para))}. Desmarque o que não foi pago com esse dinheiro e confira antes de confirmar.</p>
    ${its.length ? `<div class="tbl"><table><thead><tr><th></th><th>Item</th><th class="r">Valor</th><th class="r">Pago com esse dinheiro</th></tr></thead><tbody>${d.itens.map(it => `<tr${it.usa ? "" : ' style="opacity:.6"'}><td><input type="checkbox" data-aporteitem="${it.tipo}:${it.id}" ${a.marcados.has(it.tipo+":"+it.id) ? "checked" : ""} aria-label="Usar o dinheiro em ${esc(it.nome)}"></td><td>${esc(it.nome)}<div class="note">${esc(it.det)}</div></td><td class="r num">${brl(it.v)}</td><td class="r num">${it.usa ? `<b>${brl(it.usa)}</b>${it.usa < it.v - 0.005 ? '<div class="note">parte</div>' : ""}` : "–"}</td></tr>`).join("")}
      <tr class="tot"><td></td><td>Total</td><td></td><td class="r num">${brl(a.valor - d.sobra)}</td></tr></tbody></table></div>` : `<div class="empty">Nada da casa em ${mesLabel(m)} está sem pagamento confirmado.</div>`}
    ${d.sobra > 0.005 ? `<p class="note">Sobram ${brl(d.sobra)}: ficam registrados como transferência de ${esc(nomePessoa(a.de))} para ${esc(nomePessoa(a.para))} e contam no acerto.</p>` : ""}
    <div class="row" style="gap:8px"><button class="pri" data-aporteconf>Confirmar</button><button class="ghost" data-aportecanc>Cancelar</button></div></div>`;
}
async function confirmarAporte(m){
  const a = S.aporteCasa; if (!a || !S.db) return; const its = candidatosAporte(m, a.para); const d = distribuirAporte(a.valor, its, a.marcados || new Set(its.map(it => it.tipo+":"+it.id)));
  const id = "ap-"+uid(); const hoje = hojeISO(); S.busy = "Registrando…"; render();
  try {
    for (const it of d.itens.filter(x => x.usa > 0.005)){
      if (it.tipo === "conta"){ const c = (S.casa||[]).find(x => x.id === it.id); if (!c) continue; const {id: cid, ...corpo} = c; const pagos = {...(c.pagos||{})};
        pagos[m] = it.usa >= it.v - 0.005 ? {por:a.de, data:hoje, valor:it.v, aporte:id} : {partes:[{por:a.de, valor:it.usa, aporte:id}], data:hoje};
        await S.db.collection("casa").doc(cid).set({...corpo, pagos}); }
      else { const n = (S.notas||[]).find(x => x.id === it.id); if (!n) continue; const {id: nid, ...corpo} = n;
        const novo = it.usa >= it.v - 0.005 ? {...corpo, pagoPor:a.de, aporte:id} : {...corpo, pagoPartes:[{por:a.de, valor:it.usa, aporte:id}]};
        await S.db.collection("notas").doc(nid).set(novo); } }
    await S.db.collection("acertos").doc(id).set({tipo:"aporte", de:a.de, para:a.para, valor:d.sobra, total:a.valor, usado:Math.round((a.valor - d.sobra)*100)/100, itens:d.itens.filter(x => x.usa > 0.005).map(x => ({tipo:x.tipo, id:x.id, nome:x.nome, usa:x.usa})), mes:m, data:hoje});
    toast(`${brl(a.valor)} registrados: ${brl(a.valor - d.sobra)} pagaram ${d.itens.filter(x => x.usa > 0.005).length} item(ns) da casa${d.sobra > 0.005 ? ` e ${brl(d.sobra)} ficaram como transferência` : ""}.`); S.aporteCasa = null;
  } catch(e){ toast(errMsg(e)); }
  finally { S.busy = null; render(); }
}

async function desfazerAporte(ac){

  for (const it of (ac.itens||[])){
    if (it.tipo === "conta"){ const c = (S.casa||[]).find(x => x.id === it.id); if (!c || !c.pagos?.[m]) continue; const pg = c.pagos[m]; if (pg.aporte !== ac.id && !(pg.partes||[]).some(p => p.aporte === ac.id)) continue; const {id: cid, ...corpo} = c; const pagos = {...c.pagos}; delete pagos[m]; await S.db.collection("casa").doc(cid).set({...corpo, pagos}); }
    else { const n = (S.notas||[]).find(x => x.id === it.id); if (!n) continue; const {id: nid, ...corpo} = n;

}

      ${temHol?`<p class="note">Meses com contracheque usam os valores reais dele (bruto, INSS, IR, outros descontos). Para importar os anteriores: <button class="link" data-histhol>Histórico → Contracheques</button>.</p>`:`<p class="note">É emprego? Importe os contracheques em <button class="link" data-histhol>Histórico → Contracheques</button>: os meses com contracheque passam a usar bruto, INSS, IR e descontos reais. O nome do empregador precisa parecer com o nome desta renda.</p>`}</section>

      if (!hr) return `<section class="panel full"><h2>Quanto você ganha por hora de verdade</h2><p class="note">Sem receita em ${rotPer}.</p></section>`;
      const cfgH = horasCfg(c); const faltam = !cfgH.horasMes ? "as horas pagas por mês (ou monte os blocos desta renda na Rotina)" : ""; const L2 = (r, v, cls="") => `<tr class="${cls}"><td>${r}</td><td class="r num">${v}</td></tr>`; const hh = v => nf(v,1)+" h";

        ${L2("Planejamento e correção fora do horário", hh(hr.plan))}${hr.outras?L2("Outras horas não pagas", hh(hr.outras)):""}
        ${L2("<b>Horas que você dedica de verdade</b>", "<b>"+hh(hr.totais)+"</b>", "tot")}
        ${L2("Horas sem pagamento", isFinite(hr.pctNaoPago)?hh(hr.desloc+hr.plan+hr.outras)+" ("+pct(hr.pctNaoPago,0)+")":"–")}

      ${recs.length?`<div class="tbl"><table><tbody>${recs.map(x=>`<tr><td class="num">${dataBR(x.data)}</td><td>${esc(x.de||"")}</td><td class="r num">${brl(x.valor)}</td><td class="r"><button class="ghost" data-delrec="${c.id}|${x.id}" aria-label="Apagar recebimento">✕</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Cada aula ou serviço pago entra aqui com a data em que o dinheiro caiu. O mês soma sozinho, conta as vendas e entra no Painel no mês certo.</p>`}
      ${c.regime==="autonomo" && c.fontePagadora!=="pj"?`<p class="note">Recebendo de pessoas físicas, o IR do mês (carnê-leão) é pago até o último dia útil do mês seguinte, com DARF código 0190 gerado no e-CAC. O Painel avisa quando houver imposto.</p>`:""}</section>`; })() : ""}
    <section class="panel full"><div class="row sp"><h2 style="margin:0">Custos de ${esc(c.nome)}</h2><button class="pri" data-novocusto="${c.id}">Novo custo</button></div>
      ${custosDaRenda(c).length?`<div class="card-list" style="margin-top:10px">${custosDaRenda(c).map(k => listaCusto(k, dreRenda(c, m))).join("")}</div>`:`<div class="empty" style="margin-top:10px">Nenhum custo. Exemplos: passagem para chegar ao trabalho, alimentação fora, Hostinger, Claude, taxa da Hotmart ou do Mercado Livre, material, anúncio, notebook (como equipamento).</div>`}
      <p class="note">Custos daqui são descontados da renda em todo o sistema (Painel, Projeção, Metas). Não lance o mesmo gasto também como nota ou conta fixa, para não contar duas vezes. Qualquer custo novo, com qualquer forma de cobrança, entra pelo botão “Novo custo”; impostos, encargos e tabelas ficam em Regras e ajustes.</p></section>
    ${painelSimples(c, dreRenda(c, m))}${simuladorFuncionario(c, dreRenda(c, m))}`; }
  return `<div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap"><label class="field" for="rsel">Fonte<select id="rsel"><option value="todas">Todas as fontes</option>${lista.map(c => `<option value="${c.id}" ${sel===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>

function vContas(){
  if (!S.uid) return semConta(); if (S.form && ["conta","parcelado","consorcio","financiamento","imposto","cartao"].includes(S.form.tipo)) return formCadastro();
  const m = S.mes; const t = S.tipoLista;
  const tipos = ["conta","cartao","parcelado","consorcio","financiamento","imposto"];
  const lista = meuCad(t);
  const desc = c => {
    if (t==="cartao"){ const ps = parceladosDoCartao(c); const usado = sum(ps.map(x => restanteParcelado(x,m).valor)); const L = Number(c.limite)||0;
      return {d:`<span class="row" style="gap:6px;margin-bottom:4px">Fatura que vence em ${mesLabel(m)}: <input id="fatc-${c.id}" data-fatura="${c.id}" inputmode="decimal" class="num" style="width:100px;padding:2px 6px;text-align:right" value="${faturaInformada(c,m)!==null?nf(faturaInformada(c,m)):""}" placeholder="valor real"></span>fecha dia ${c.diaFechamento||"?"} · vence dia ${c.diaVencimento||"?"} · ${ps.length} compra(s) · próxima fatura (${mesLabel(addMes(m,1))}): ${brl(faturaCartao(c, addMes(m,1)))} · em aberto ${brl(usado)}${L?` de ${brl(L)} de limite (${pct(usado/L,0)})`:""}`, v:brl(faturaCartao(c,m)), s:"fatura de "+mesLabel(m)}; }
    if (t==="conta"){ const v = valorConta(c,m); return {d:`${esc(c.cat||"")}${c.dia?" · dia "+c.dia:""}${c.reajuste?" · reajuste "+nf(c.reajuste,1)+"%/ano":""}${c.inicio?" · desde "+mesLabel(c.inicio):""}${c.fim?" até "+mesLabel(c.fim):""}`, v:brl(v||c.valor), s:STATUS[c.status]}; }
    if (t==="parcelado"){ const k = parcelaNoMes(c,m), rr = restanteParcelado(c,m); return {d:`${esc(c.cartao||"")} · parcela ${clamp(k,0,+c.totalParcelas||0)}/${c.totalParcelas} em ${mesLabel(m)} · faltam ${rr.n} (${brl(rr.valor)})${c.juros==="sim"?" · com juros":""}`, v:brl(c.valorParcela), s: rr.n?"em aberto":"quitada"}; }
    if (t==="consorcio"){ const e = consorcioEstado(c,m); return {d:`${esc(c.bem||"")}${e.restantes!==null?` · ${e.pagas}/${e.total} pagas, faltam ${e.restantes} (${brl(e.saldo)})`:" · informe total e parcelas pagas"}${e.sim?(e.sim.tipo==="prazo"?` · lance de ${brl(c.lance)}: ${e.sim.menos} parcelas a menos`:` · lance de ${brl(c.lance)}: parcela cai para ${brl(e.sim.novaParcela)}`):(c.lance?` · lance planejado ${brl(c.lance)}`:"")}${e.custoAdm?` · taxa de adm. total ${brl(e.custoAdm)}`:""}`, v:brl(c.parcela), s:c.contemplado==="sim"?"contemplado":"aguardando"}; }
    if (t==="financiamento"){ const tb = tabelaFin(c); return {d:`${brl(tb.pv)} em ${tb.n} meses, ${nf(c.taxaAA,2)}% a.a., ${c.sistema==="price"?"Price":"SAC"} · 1ª ${brl(tb.primeira)}, última ${brl(tb.ultima)} · juros totais ${brl(tb.juros)} · renda mínima (${P().comprometimentoMax}%): ${brl(tb.primeira/(P().comprometimentoMax/100))}`, v:brl(tb.primeira), s:c.status==="ativa"?"contratado":"simulação"}; }
    if (t==="imposto"){ const a = impostoAnual(c); return {d:`${c.base?brl(c.base)+" × "+nf(c.aliquota,1)+"% · ":""}${c.cotas||1} cota(s) a partir de ${mesLabel(c.mesPrimeira)} · guardar ${brl(a/12)}/mês`, v:brl(a)+"/ano", s:STATUS[c.status]}; }
  };
  const tot = t==="parcelado" ? `<p class="note">Total em aberto nos cartões a partir de ${mesLabel(m)}: <b class="num">${brl(cartaoRestante(m))}</b>. Parcelas conhecidas deste mês: <b class="num">${brl(sum(meuCad("parcelado").map(c=>valorParcelado(c,m))))}</b> (a fatura inteira, com compras à vista, fica em Cartões e no Painel).</p>` : "";

    <label class="field" for="cp-pessoa">De quem é${selPessoas("pessoa", donoDe(c), 'id="cp-pessoa"')}</label>

  return `<div class="row sp" style="margin-bottom:12px"><div class="seg" role="group">${tipos.map(k=>`<button aria-pressed="${t===k}" data-lista="${k}">${TYPES[k].plural}</button>`).join("")}</div><button class="pri" data-novo="${t}">Novo: ${TYPES[t].rot.toLowerCase()}</button></div>
  ${resumoMesC}${tot}${soltos.length?`<div class="alert" style="margin-bottom:10px">Há compras no(s) cartão(ões) ${soltos.map(esc).join(", ")} sem cartão cadastrado. ${soltos.map(n=>`<button class="link" data-novocartao="${esc(n)}">Cadastrar ${esc(n)}</button>`).join(" ")} (com o dia de fechamento, cada compra nova cai na fatura certa).</div>`:""}
  <div class="card-list">${lista.length?lista.map(c=>{ const x = desc(c); return `<div class="cad"><div><div class="t">${esc(c.nome)} <span class="pill">${esc(x.s||"")}</span></div><div class="d">${x.d}</div>${c.obs?`<div class="d">${esc(c.obs)}</div>`:""}</div><div class="v">${x.v}<div>${t==="cartao"?`<button data-compra="${c.id}">Nova compra</button>`:""}<button class="ghost" data-editcad="${c.id}">Editar</button></div></div></div>${t==="cartao"&&S.compra===c.id?fCompra(c):""}`; }).join(""):`<div class="empty">Nada cadastrado aqui ainda.</div>`}</div>`;
}

function vInvest(){
  if (!S.uid) return semConta(); if (S.form && ["investimento","custoRenda","analise","ofertaRF","carteira","operacao"].includes(S.form.tipo)) return formCadastro();
  const iv = S.ivista || "passo"; const fgc = alertasFGC();
  const segI = `<div class="seg" role="group" style="margin-bottom:14px">${[["passo","Investir passo a passo"],["carteiras","Carteiras e rendimento"],["carteira","Carteira"],["alan","Meu método"],["analise","Analisar ativos"],["rf","Comparar renda fixa"],["patrimonio","Patrimônio e independência"]].map(([k,l]) => `<button aria-pressed="${iv===k}" data-ivista="${k}">${l}</button>`).join("")}</div>${fgc.map(x => `<div class="alert bad" style="margin-bottom:10px">${x}</div>`).join("")}`;
  return segI + (iv === "analise" ? vAnalises() : iv === "patrimonio" ? vPatrimonio() : iv === "rf" ? vRendaFixa() : iv === "alan" ? vMetodoAlan() : iv === "passo" ? vProcesso() : iv === "carteiras" ? vCarteiras() : vCarteiraInv());
}
function vCarteiraInv(){
  const p = P(), cart = carteira(); const m = S.mes; const fase = faseCascata(m);
  const porClasse = {}; cart.forEach(x => porClasse[x.c.classe] = (porClasse[x.c.classe]||0) + x.atual);
  const arcaK = ["acoes","fii","caixa","internacional"]; const totArca = sum(arcaK.map(k=>porClasse[k]||0));
  const aporte = toNum(S.aporte)||0; const alvoTot = totArca + aporte;
  const def = arcaK.map(k => Math.max(0, alvoTot*p.arca[k]/100 - (porClasse[k]||0))); const somaDef = sum(def);
  const sug = arcaK.map((k,i) => somaDef ? aporte*def[i]/somaDef : aporte*p.arca[k]/100);
  const acoesSug = sug[0]; const metas = meuCad("meta");
  const total = sum(cart.map(x=>x.atual)); const irProv = sum(cart.map(x=>x.ir||0)); const prov12 = sum(cart.map(x=>x.proventos12||0)); const soltas = opsSemInvestimento();
  const semDolar = cart.some(x => x.pr.usd) && !(Number(p.dolar) > 0);
  const custo = fase.custo;
  const reserva = porClasse.reserva || 0;
  return `<section class="kpis">${kpi("Patrimônio investido", brl(total), cart.length+" aplicações")}${kpi("Reserva de emergência", brl(reserva), custo?nf(reserva/custo,1)+" meses do custo essencial":"cadastre as contas fixas")}${kpi("IR a provisionar", brl(irProv), "se resgatar ou vender tudo hoje")}${prov12?kpi("Proventos e juros", brl(prov12), "últimos 12 meses, pelas operações", "pos"):""}${kpi("Fase", esc(fase.rot), fase.fase==="arca"?"ARCA liberado":"ARCA bloqueado até esta fase")}</section>
  ${semDolar?`<div class="alert" style="margin-bottom:12px">Você tem investimento no exterior: informe a cotação do dólar em Regras e ajustes para o valor sair em reais.</div>`:""}
  <div class="grid g2">
    <section class="panel"><h2>Reserva de emergência</h2>
      <div class="bars">${p.reservaFases.map(f=>{ const alvo = custo*f; return `<div class="bar"><span class="lbl">${f} meses</span><span class="track"><span class="fill${reserva>=alvo?"":" sup"}" style="width:${alvo?clamp(reserva/alvo*100,0,100).toFixed(1):0}%"></span></span><span class="val">${brl(alvo)}</span></div>`; }).join("")}</div>
      <p class="note">Base: custo essencial de ${brl(custo)} por mês (contas fixas essenciais, consórcio, financiamentos e impostos de ${mesLabel(m)}; parcelas do cartão ficam de fora porque acabam).</p></section>
    <section class="panel"><h2>Aporte pelo ARCA</h2>
      <label class="field" for="aporte">Quanto vai investir agora<input id="aporte" inputmode="decimal" class="num" value="${esc(S.aporte)}" placeholder="0,00"></label>
      ${fase.fase!=="arca"?`<p class="alert" style="margin-top:10px">Pela sua cascata, este dinheiro ainda vai para: ${esc(fase.rot)}. A divisão abaixo é só simulação.</p>`:""}
      <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Classe</th><th class="r">Hoje</th><th class="r">Alvo</th><th class="r">Colocar</th></tr></thead><tbody>
      ${arcaK.map((k,i)=>{ const at = porClasse[k]||0; const pa = totArca? at/totArca : 0; const fora = totArca && (pa*100 < p.arca.min || pa*100 > p.arca.max); return `<tr><td>${esc(CLASSES[k].replace(" – ARCA",""))}</td><td class="r num ${fora?"neg":""}">${brl(at)} <small class="mut">${totArca?pct(pa,0):""}</small></td><td class="r num">${p.arca[k]}%</td><td class="r num">${brl(sug[i])}</td></tr>`; }).join("")}
      <tr class="sub"><td>↳ Ações estilo Barsi</td><td></td><td class="r num">${p.barsiPct}%</td><td class="r num">${brl(acoesSug*p.barsiPct/100)}</td></tr>

function vImpostos(){

  const porRenda = meuCad("renda").filter(c=>c.status!=="planejada").map(c => { const mms = ms.filter(m => m <= addMes(MES_ATUAL, 12) && dreRenda(c, m).receita > 0); const ds = mms.map(m => dreRenda(c, m)); return {c, n:mms.length, t:{inss:sum(ds.map(d => d.inss||0)), ir:sum(ds.map(d => d.ir||0)), das:sum(ds.map(d => d.impReceita||0))}}; }).filter(x=>x.n);
  const inss = sum(porRenda.map(x=>x.t.inss)), ir = sum(porRenda.map(x=>x.t.ir)), das = sum(porRenda.map(x=>x.t.das));
  const anuais = meuCad("imposto").filter(c=>c.status==="ativa"); const totAn = sum(anuais.map(impostoAnual));
  const irInv = sum(carteira().map(x=>x.ir||0));
  const notasAno = S.notas.filter(n=>String(n.mes||"").startsWith(ano)); const icms = sum(notasAno.map(n=>Number(n.icms)||0)); const trib = sum(notasAno.map(n=>Number(n.tributosAprox)||0));
  const gastoCat = {}; notasAno.forEach(n=>(n.itens||[]).forEach(it=>gastoCat[it.cat]=(gastoCat[it.cat]||0)+(Number(it.v)||0)));
  const estCons = Object.entries(gastoCat).map(([k,v])=>({k, v, al:Number(p.cargaConsumo?.[k])||0})).filter(x=>x.al).map(x=>({...x, imp:x.v*x.al/100}));
  const totEst = sum(estCons.map(x=>x.imp)); const semAl = Object.keys(gastoCat).filter(k=>!(Number(p.cargaConsumo?.[k])));
  const total = inss+ir+das+totAn+icms;
  return `<section class="kpis">${kpi("Impostos conhecidos em "+ano, brl(total), "renda, anuais e ICMS das notas")}${kpi("Sobre a renda", brl(inss+ir+das), "INSS, IR e DAS")}${kpi("Impostos anuais", brl(totAn), anuais.length+" cadastrados")}${kpi("No consumo (ICMS real)", brl(icms), notasAno.length+" notas no ano")}</section>
  <div class="grid g2">
    <section class="panel"><h2>Sobre a renda</h2>${porRenda.length?`<div class="tbl"><table><thead><tr><th>Fonte</th><th class="r">Meses</th><th class="r">INSS</th><th class="r">IR</th><th class="r">DAS</th></tr></thead><tbody>${porRenda.map(x=>`<tr><td>${esc(x.c.nome)}<div class="note">${esc(REGIMES[x.c.regime]||"")}</div></td><td class="r num">${x.n}</td><td class="r num">${brl(x.t.inss)}</td><td class="r num">${brl(x.t.ir)}</td><td class="r num">${brl(x.t.das)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhuma renda ativa em ${ano}.</div>`}

    ${(()=>{ const hs = meuCad("holerite").filter(h=>String(h.competencia||"").startsWith(ano)); if (!hs.length) return ""; const t = f => sum(hs.map(h=>Number(h[f])||0));
      return `<section class="panel"><h2>Retido nos contracheques de ${ano}</h2><div class="tbl"><table><tbody><tr><td>Rendimento bruto</td><td class="r num">${brl(t("bruto"))}</td></tr><tr><td>INSS descontado</td><td class="r num">${brl(t("inss"))}</td></tr><tr><td>IR retido na fonte</td><td class="r num">${brl(t("irrf"))}</td></tr><tr><td>FGTS depositado</td><td class="r num">${brl(t("fgts"))}</td></tr></tbody></table></div><p class="note">Valores reais de ${hs.length} contracheque(s): são os que vão para a declaração.</p></section>`; })()}
    <section class="panel"><h2>Impostos e taxas anuais</h2>${anuais.length?`<div class="tbl"><table><tbody>${anuais.map(c=>`<tr><td>${esc(c.nome)}</td><td class="r num">${brl(impostoAnual(c))}</td><td class="r num mut">${brl(impostoAnual(c)/12)}/mês</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhum imposto anual ativo. IPVA, IPTU e licenciamento entram em Contas e dívidas.</div>`}

      <form id="fDeduc" class="form" style="margin-top:10px">${[["saude","Despesas médicas no ano (sem limite)"],["educacao","Educação no ano (tem limite por pessoa)"],["pgbl","Aportes em PGBL no ano (até 12% da renda)"],["dependentes","Número de dependentes"]].map(([k,l])=>`<label class="field" for="dd-${k}">${l}<input id="dd-${k}" name="${k}" inputmode="decimal" class="num" value="${d[k]?nf(d[k],k==="dependentes"?0:2):""}" placeholder="0"></label>`).join("")}

function vProjecao(){
  if (!S.uid) return semConta();
  const base = S.mes < MES_ATUAL ? MES_ATUAL : S.mes; const ms = Array.from({length:15},(_,i)=>addMes(base,i));
  const gm = gastoMedioMes();
  const rows = ms.map(m => { const sb = sobraMes(m); const comp = compromissosMes(m);
    const by = t => sum(comp.filter(l=>l.tipo===t).map(l=>l.v)); return {m, rA:sb.renda, rP:sb.rendaP, rE:sb.rendaEst, sobraE:sb.sobraEst, rec:previstoReceberMes(m), conta:by("conta"), cartao:by("parcelado"), cons:by("consorcio"), fin:by("financiamento"), imp:by("imposto"), casa:by("casa"), tot:sb.contas, gm:sb.gastos, gf:sb.gastosFonte, sobra:sb.sobra, sobraP:sb.sobraP}; });
  const max = Math.max(1, ...rows.map(r=>Math.max(r.rP, r.tot, r.rA + r.rE))); const W=720,H=230,pl=56,pb=24,bw=(W-pl-8)/rows.length; const y = v => H-pb - v/max*(H-pb-12);
  const ticks = [0,.25,.5,.75,1].map(f=>max*f);
  const neg = rows.filter(r=>r.sobraE<0);
  return `<div class="alert" style="margin-bottom:14px">A renda só entra nos totais quando o mês tem contracheque (ou o valor lançado). Até lá ela aparece como <b>estimada</b>, em coluna separada, pelo último contracheque. Cada renda aparece no mês em que cai na conta: o contracheque de setembro, pago em outubro, conta em outubro.</div>${neg.length?`<div class="alert bad" style="margin-bottom:14px">Mesmo com a renda estimada, faltam recursos em ${neg.length} dos próximos 15 meses, já contando os gastos do dia a dia (o primeiro é ${mesLabel(neg[0].m)}: ${brl(neg[0].sobraE)}).</div>`:""}
  <section class="panel chart"><h2>Próximos 15 meses</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Contas por mês em barras, renda ativa e renda com planejadas em traços">
      ${ticks.map(t=>`<line x1="${pl}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t).toLocaleString("pt-BR")}</text>`).join("")}
      ${rows.map((r,i)=>{ const cx = pl+i*bw; return `<rect x="${cx+bw*.2}" y="${y(r.tot)}" width="${bw*.6}" height="${H-pb-y(r.tot)}" fill="var(--petrol)" rx="2"><title>${mesLabel(r.m)}: contas ${brl(r.tot)}</title></rect>
        <line x1="${cx+bw*.08}" x2="${cx+bw*.92}" y1="${y(r.rA)}" y2="${y(r.rA)}" stroke="var(--good)" stroke-width="2.5"><title>renda confirmada ${brl(r.rA)}</title></line>${r.rE > 0.5 ? `<line x1="${cx+bw*.08}" x2="${cx+bw*.92}" y1="${y(r.rA + r.rE)}" y2="${y(r.rA + r.rE)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="3 3"><title>com a renda estimada ${brl(r.rA + r.rE)}</title></line>` : ""}
        ${r.rP>r.rA?`<line x1="${cx+bw*.08}" x2="${cx+bw*.92}" y1="${y(r.rP)}" y2="${y(r.rP)}" stroke="var(--ochre)" stroke-width="2" stroke-dasharray="4 3"><title>com planejadas ${brl(r.rP)}</title></line>`:""}
        <text x="${cx+bw/2}" y="${H-6}" text-anchor="middle">${MONTHS[+r.m.slice(5,7)-1]}</text>`; }).join("")}
    </svg>
    <p class="note">Barras: contas e dívidas. Verde: renda confirmada por contracheque ou valor lançado (já sem os custos de cada fonte). Verde tracejado: somando a renda estimada. Ocre tracejado: renda somando as metas das fontes planejadas. A sobra desconta os gastos do dia a dia: no mês atual, os lançados até agora; nos meses seguintes, a média dos meses lançados (${brl(gm)} por mês${gm?"":"; lance notas ou extratos para entrar na conta"}). É a mesma conta do Painel e da aba Ano.</p></section>
  <section class="panel" style="margin-top:16px"><p class="note" style="margin-top:0">* mês atual: gastos lançados até agora.</p><div class="tbl"><table><thead><tr><th>Mês</th><th class="r">Renda confirmada</th><th class="r">Estimada (fora)</th><th class="r">Fixas</th><th class="r">Cartão</th><th class="r">Consórcio</th><th class="r">Financ.</th><th class="r">Impostos</th><th class="r">Casa</th><th class="r">Dia a dia</th><th class="r">Sobra</th><th class="r">Sobra com a estimada</th><th class="r">Com planejadas</th><th class="r">A receber</th></tr></thead><tbody>

}

function vCasa(){

      <td class="r">${c.status==="ativa" && c.periodicidade!=="anual"?`<input id="vm-${c.id}" data-valmes="${c.id}" inputmode="decimal" class="num" style="width:100px;text-align:right" value="${v?nf(v):""}" placeholder="0,00" aria-label="Valor de ${esc(c.nome)} em ${mesLabel(m)}">${c.variavel==="sim"&&!informado&&v?`<div class="note">estimado</div>`:""}`:`<span class="num">${brl(v)}</span>`}</td>
      <td><select id="pp-${c.id}" data-pagopor="${c.id}" aria-label="${rec?"Quem recebe":"Quem paga"} ${esc(c.nome)}" style="max-width:130px${v && !c.pagoPor?";border-color:var(--bad)":""}"><option value="">${v?(rec?"Quem recebe?":"Quem paga?"):"—"}</option>${S.familia.pessoas.map(p=>`<option value="${p.id}" ${c.pagoPor===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></td>
      ${part.map(p=>`<td class="r num">${partes[p.id]?brl(partes[p.id]):"–"}</td>`).join("")}</tr>`; };
  const semValor = contas.filter(c => c.status === "ativa" && c.origem !== "pessoal" && !valorContaCasa(c, m) && !(c.inicio && m < c.inicio) && !(c.fim && m > c.fim) && !(c.periodicidade === "anual" && Number(c.valor) > 0));
  const divSel = `<section class="panel full"><div class="row sp" style="flex-wrap:wrap;gap:8px"><h2 style="margin:0">Como a casa é dividida</h2><select id="divisao-casa" data-divisao aria-label="Como dividir a casa" style="max-width:100%;min-width:0"><option value="pago" ${modoPago() ? "selected" : ""}>Sem divisão: cada um conta só o que pagou</option><option value="regra" ${!modoPago() ? "selected" : ""}>Dividir: pela regra de cada conta (renda, igual, fixo ou de uma pessoa)</option></select></div>
    <p class="note">${modoPago() ? "Ninguém tem parte calculada. Entra na sua conta da casa só o que você confirmou que pagou: as contas marcadas como pagas por você (ou que você costuma pagar), as compras que você pagou e o dinheiro que você entregou. Quando decidirem como dividir, troque aqui e escolha a regra de cada conta." : "Cada conta segue a regra dela; as compras da casa e as contas proporcionais usam a renda informada abaixo. O acerto mostra quem deve para quem."}</p></section>`;
  return `${divSel}${!modoPago() && semRendaDivisao(m)?`<div class="alert" style="margin-bottom:12px">Ninguém informou a renda para a divisão em ${mesLabel(m)}, então as contas proporcionais e as compras da casa estão em <b>partes iguais</b>. Preencha “Renda usada na divisão” abaixo.</div>`:""}
  ${semValor.length?`<div class="alert" style="margin-bottom:12px">${semValor.length} conta(s) da casa sem valor em ${mesLabel(m)}: ${semValor.map(c=>esc(c.nome)).join(", ")}. Digite o valor na tabela (ou toque no nome para editar). Contas que vocês não têm podem ser excluídas.</div>`:""}
  ${(() => { const vp = verPessoa(); const rr = r.rateio.find(x => x.p.id === vp); if (!rr || vp === "todos") return ""; const vcC = viaCartaoPartes(m, vp).casa; return `<div class="alert" style="margin-bottom:10px">Sua parte da casa em ${mesLabel(m)}: <b>${brl(rr.cotaContas + Math.max(0, rr.cotaNotas - vcC))}</b> = contas ${brl(rr.cotaContas)} + compras ${brl(Math.max(0, rr.cotaNotas - vcC))}${vcC > 0.005 ? ` (mais ${brl(vcC)} de compras que já estão na fatura do cartão)` : ""}. É o mesmo valor de “Minha parte da casa” no Painel.</div>`; })()}

  ${S.familia.pessoas.filter(p => p.rateio !== false).length < 2 ? `<div class="alert" style="margin-bottom:12px"><b>Só ${S.familia.pessoas.length ? esc(S.familia.pessoas[0].nome) : "você"} divide as contas da casa</b>, então tudo da casa fica na sua parte. Para dividir, cadastre quem mora com você em <button class="link" data-tab="ajustes">Ajustes → Quem mora na casa</button>. A pessoa não precisa ter conta nem usar o sistema. Se você só ajuda com um valor por mês (por exemplo R$ 500), coloque esse valor em “Contribui com valor fixo” no seu nome.</div>` : ""}
  ${fixosCasa().length ? `<div class="alert" style="margin-bottom:12px">${fixosCasa().map(p => `<b>${esc(p.nome)}</b> contribui com valor fixo de ${brl(Number(p.contribFixa))} por mês`).join("; ")}. O resto da casa (contas e compras) é dividido entre os outros pela regra de cada conta.</div>` : ""}
  <div class="grid g2">

    ${(() => { const desp = contas.filter(c => !ehReceitaCasa(c)), recs = contas.filter(ehReceitaCasa); const parteDe = (pid, rec) => sum(r.contasCasa.filter(x => !!x.receita === rec).map(x => Math.abs(x.partes[pid]||0)));
    const ajC = ajustarPartesCasa(m, r.contasCasa, r.casaNotas, pesosRenda(m)); const parteCompra = (pid, v) => r.casaNotas > 0.005 ? v*((ajC[pid]||{}).notas||0)/r.casaNotas : 0; const comprasC = notasDoMes(m).map(n => ({n, v:valorCasaNota(n)})).filter(x => x.v > 0.005).sort((a,b) => String(a.n.data).localeCompare(String(b.n.data)));
    const linhasCompra = comprasC.map(x => `<tr><td>${esc("Compra em "+(x.n.emitente||"loja"))} <span class="pill">compra</span><div class="note">${dataBR(String(x.n.data).slice(0,10))}${Array.isArray(x.n.pagoPartes) && x.n.pagoPartes.length ? " · "+x.n.pagoPartes.map(pp => brl(Number(pp.valor)||0)+" com o dinheiro de "+esc(nomePessoa(pp.por))).join("; ") : ""}</div></td><td class="r num">${brl(x.v)}</td><td><button data-mmnota="${x.n.id}">Editar quem pagou</button></td>${part.map(p => `<td class="r num">${brl(parteCompra(p.id, x.v))}</td>`).join("")}<td>${x.n.pagoPor ? `<span class="pos">pago por ${esc(nomePessoa(x.n.pagoPor))}</span>` : Array.isArray(x.n.pagoPartes) && x.n.pagoPartes.length ? `<span class="pos">${x.n.pagoPartes.map(pp => esc(nomePessoa(pp.por)) + " " + brl(pp.valor)).join(" · ")}</span>` : `<span class="note">não confirmado</span>`}</td></tr>`).join("");
    return (desp.length || comprasC.length?`<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Conta</th><th class="r">Valor do mês</th><th>Quem paga</th>${part.map(p=>`<th class="r">${esc(p.nome)}</th>`).join("")}<th>Pago em ${mesLabel(m)}?</th></tr></thead><tbody>${desp.map(c => linhaConta(c).replace(/<\/tr>\s*$/, `<td>${(() => { const pg = c.pagos?.[m]; return `<select data-confpag="${c.id}" aria-label="Pagamento de ${esc(c.nome)} em ${mesLabel(m)}"><option value="">— não confirmado —</option>${S.familia.pessoas.map(p => `<option value="${p.id}" ${pg?.por === p.id ? "selected" : ""}>${esc(p.nome)} pagou</option>`).join("")}</select>${pg ? `<div class="note">${Array.isArray(pg.partes) ? pg.partes.map(pp => brl(Number(pp.valor)||0)+" com o dinheiro de "+esc(nomePessoa(pp.por))).join("; ")+"; o resto não confirmado" : pg.aporte ? "com o dinheiro entregue por "+esc(nomePessoa(pg.por)) : ""} em ${dataBR(pg.data)}</div>` : ""}`; })()}</td></tr>`)).join("")}

    + (recs.length?`<h3>Receitas em conjunto</h3><div class="tbl"><table><thead><tr><th>Receita</th><th class="r">Valor do mês</th><th>Quem recebe</th>${part.map(p=>`<th class="r">${esc(p.nome)}</th>`).join("")}</tr></thead><tbody>${recs.map(linhaConta).join("")}
    <tr class="tot"><td>Total das receitas</td><td class="r num pos">${brl(r.casaReceitas)}</td><td></td>${part.map(p=>`<td class="r num pos">${brl(parteDe(p.id,true))}</td>`).join("")}</tr>
    <tr class="tot"><td>Contas − receitas</td><td class="r num">${brl(r.casaContas - r.casaReceitas)}</td><td></td>${part.map(p=>`<td class="r num">${brl(parteDe(p.id,false) - parteDe(p.id,true))}</td>`).join("")}</tr></tbody></table></div>`:""); })()}
    <p class="note">Contas que mudam todo mês (água, luz, gás): o valor digitado vale só para ${mesLabel(m)}; nos meses sem valor, o sistema repete o último como estimativa. Contas fixas (aluguel, internet): o valor digitado passa a valer todo mês. IPTU e outras anuais são divididas nas cotas (toque no nome). Receitas em conjunto (aluguel de um cômodo, auxílio para a casa, alguém de fora que ajuda nas contas) são divididas pela mesma regra e diminuem a parte de cada um; quem recebe o dinheiro fica devendo a parte dos outros no acerto. Cada pessoa vê só a parte dela no próprio Painel, separada das contas pessoais.</p></section>

    const acMes = (S.acertos||[]).filter(a => a.mes === m);
    return `<section class="panel full"><h2>O que cada um pagou da casa em ${mesLabel(m)}</h2><div class="tbl"><table><thead><tr><th>Pessoa</th><th class="r">Contas</th><th class="r">Compras</th><th class="r">Dinheiro entregue</th><th class="r">Total</th></tr></thead><tbody>${linhas.map(x => `<tr><td>${esc(x.p.nome)}</td><td class="r num">${brl(x.ct)}</td><td class="r num">${brl(x.cp)}</td><td class="r num">${brl(x.dn)}</td><td class="r num"><b>${brl(x.t)}</b></td></tr>`).join("")}<tr class="tot"><td>Total</td><td class="r num">${brl(sum(linhas.map(x => x.ct)))}</td><td class="r num">${brl(sum(linhas.map(x => x.cp)))}</td><td class="r num">${brl(sum(linhas.map(x => x.dn)))}</td><td class="r num">${brl(sum(linhas.map(x => x.t)))}</td></tr></tbody></table></div>
      <p class="note">Contas: as que você confirmou como pagas ou, se ainda não confirmou, as que você costuma pagar (“Quem paga”). Compras: as notas da casa pagas por você, inclusive com dinheiro entregue. Dinheiro entregue: o que você deu e não pagou nenhum item específico.</p>

      ${S.aporteCasa ? vAporteCasa(m) : ""}

/* lê o contracheque com o texto em colunas e, quando der, também as imagens das páginas (o Claude vê a tabela como ela é) */
async function lerHolerite(file){

    if (mg){ if (mg.falhas) mg.rows.forEach(r => r.avisoArquivo = `${mg.falhas} demonstrativo(s) deste PDF não fecharam a conta e ficaram de fora: confira e lance à mão`); return mg.rows; } }
  if (!S.sample) throw new Error("Este documento precisa do Claude para ser lido, e ele não está disponível nesta visualização.");
  const lim = await S.sample.limits().catch(() => null); const maxImg = Math.min(3, lim?.images?.maxCount || 0);
  let texto = "", imgs = [];

  const corpo = (texto ? "\n\nTexto do documento (as colunas foram mantidas com espaços; cada linha é uma linha do contracheque):\n" + texto.slice(0, 80000) : "") + (imgs.length ? `\n\n${texto ? "As imagens anexadas são as páginas deste mesmo documento: use-as para conferir em que coluna (referência, vencimento ou desconto) cada valor está." : "O contracheque está nas imagens anexadas."}` : "");
  try { return await S.sample.json(PROMPT_HOL + corpo, imgs.length ? {images:imgs, modelTier:"default"} : {modelTier:"default"}); }

}

/* .zip com vários contracheques: abre e lê cada PDF ou foto */
async function expandirZips(files){
  const out = [];
  for (const f of files){
    if (!/\.zip$/i.test(f.name) && !/zip/.test(f.type)){ out.push(f); continue; }
    if (!window.JSZip) await new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload = ok; s.onerror = () => erro(new Error("Não consegui abrir o .zip (sem internet?). Extraia os PDFs e envie todos de uma vez.")); document.head.appendChild(s); });
    const z = await JSZip.loadAsync(await f.arrayBuffer());
    const ents = Object.values(z.files).filter(e => !e.dir && /\.(pdf|png|jpe?g|webp)$/i.test(e.name) && !/(^|\/)(__MACOSX|\.)/.test(e.name)).sort((a,b) => a.name.localeCompare(b.name, "pt", {numeric:true}));
    for (const e of ents){ const nome = e.name.split("/").pop(); const ext = nome.split(".").pop().toLowerCase(); const tipo = ext === "pdf" ? "application/pdf" : "image/" + (ext === "jpg" ? "jpeg" : ext);
      out.push(new File([await e.async("blob")], nome, {type:tipo})); }
  }
  return out;
}
/* contrato do Estado: o número da admissão muda a cada contrato temporário. Contratos que se sucedem (um acaba, o outro começa) viram a mesma renda;

function unificarMatriculasMG(rows){
  const porMasp = {}; rows.filter(r => r.fonteLeitura === "mg" && r.masp).forEach(r => (porMasp[r.masp] ||= []).push(r));
  Object.entries(porMasp).forEach(([masp, rs]) => {
    const adms = {}; rs.forEach(r => { const a = String(r.matricula).split("/").pop(); const o = adms[a] ||= {a, ini:r.competencia, fim:r.competencia, rs:[]}; if (r.competencia < o.ini) o.ini = r.competencia; if (r.competencia > o.fim) o.fim = r.competencia; o.rs.push(r); });
    const faixas = []; Object.values(adms).sort((x,y) => x.ini.localeCompare(y.ini) || x.a.localeCompare(y.a, "pt", {numeric:true})).forEach(o => {
      let f = faixas.find(f => f.fim < o.ini); if (!f){ f = {fim:"", chave: faixas.length ? masp+"/"+o.a : masp}; faixas.push(f); } f.fim = o.fim; o.rs.forEach(r => { r.matricula = f.chave; }); }); });

function csvSplit(linha, d){ const out = []; let cur = "", q = false; for (let i=0;i<linha.length;i++){ const ch = linha[i]; if (ch === '"'){ if (q && linha[i+1] === '"'){ cur += '"'; i++; } else q = !q; } else if (ch === d && !q){ out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(s => s.trim()); }

function parseCSVExtrato(txt){

  if (iD < 0 || iV < 0) return null;
  const cartao = h.includes("title") || h.includes("amount");
  const rows = linhas.slice(1).map(l => { const c = csvSplit(l, d); const v = toNum(c[iV]); return {data:dataISO(c[iD]), desc:(iT>=0?c[iT]:"") || "(sem descrição)", v: cartao ? v : -v}; }).filter(r => r.data && isFinite(r.v));

function parseOFX(txt){

function vPrecos(){
  const atual = precosPorMes(S.mes), inf = inflacaoMes(S.mes), ano = S.mes.slice(0,4), ia = inflacaoAno(ano);
  const hist = {}; S.notas.filter(n=>n.mes < S.mes).sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(n => (n.itens||[]).forEach(it => { if (it.q>0) hist[chaveProduto(n,it)] = {p:it.v/it.q, mes:n.mes}; }));
  let linhas = Object.entries(atual).map(([k,o]) => { const p = o.q>0 ? o.v/o.q : 0; const h = hist[k]; return {nome:o.nome, u:o.u, loja:o.loja, p, v:o.v, ant:h?.p, antMes:h?.mes, var: h && h.p ? p/h.p-1 : null}; });
  const q = S.busca.trim().toUpperCase(); if (q) linhas = linhas.filter(l => l.nome.toUpperCase().includes(q)); linhas.sort((a,b) => (b.var ?? -9) - (a.var ?? -9) || b.v - a.v);
  const ip = Object.entries(S.familia.ipca||{}).filter(([m])=>m.startsWith(ano)); const ipcaAno = ip.reduce((a,[,v])=>a*(1+Number(v)/100),1)-1;
  return `<section class="kpis">${kpi("Inflação pessoal do mês", inf.ok?pct(inf.taxa,2):"–", inf.ok?`${inf.n} produtos, ${pct(inf.cobertura,0)} do gasto anterior`:"sem produtos repetidos entre os meses", inf.ok?(inf.taxa>0?"neg":"pos"):"")}${kpi("Acumulada em "+ano, ia.meses?pct(ia.taxa,2):"–", ia.meses+" meses com dado")}${kpi("IPCA em "+ano, ip.length?pct(ipcaAno,2):"–", ip.length?ip.length+" meses informados":"informe em Regras e ajustes")}</section>

    <p class="note">Preço por kg ou unidade, comparado com a última compra do mesmo produto na mesma loja.</p>
    ${linhas.length?`<div class="tbl"><table><thead><tr><th>Produto</th><th>Loja</th><th class="r">Agora</th><th class="r">Antes</th><th class="r">Variação</th></tr></thead><tbody>${linhas.map(l=>`<tr><td class="it-desc">${esc(l.nome)}</td><td>${esc(l.loja)}</td><td class="r num">${brl(l.p)}/${l.u==="KG"?"kg":"un"}</td><td class="r num">${l.ant?brl(l.ant)+` <small class="mut">${mesLabel(l.antMes)}</small>`:"–"}</td><td class="r num ${l.var>0.001?"neg":l.var<-0.001?"pos":""}">${l.var===null?`<span class="pill">primeira compra</span>`:(l.var>0?"+":"")+pct(l.var)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">${q?"Nenhum produto com esse nome.":"Nenhuma compra com itens neste mês."}</div>`}</section>`;
}

function vAno(){
  const ano = S.mes.slice(0,4); const ms = Array.from({length:12},(_,i)=>ano+"-"+String(i+1).padStart(2,"0"));
  const ini = inicioControle(); const fora = m => m < ini;

  return `<section class="kpis">${kpi("Gastos (notas e extratos) em "+ano, brl(sum(rs.map(x=>x.g.total))))}${kpi("Contas e dívidas", brl(sum(rs.map(x=>x.comp))), ms.some(m=>m>MES_ATUAL)?"meses futuros pelo previsto":"")}${kpi("Renda líquida confirmada", brl(sum(rs.map(x=>x.renda))), (()=>{ const e = sum(rs.map(x=>x.rendaEst||0)); return "contracheques e valores lançados" + (e > 0.004 ? ` · + estimado ${brl(e)} nos meses sem contracheque (fora do total)` : ""); })())}${kpi("Inflação pessoal", ia.meses?pct(ia.taxa,2):"–", "acumulada no ano")}</section>

    ${[0,.25,.5,.75,1].map(f=>max*f).map(t=>`<line x1="${pl}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t).toLocaleString("pt-BR")}</text>`).join("")}
    ${rs.map((x,i)=>{ const cx = pl+i*bw; return `<rect x="${cx+bw*.2}" y="${y(x.comp)}" width="${bw*.6}" height="${H-pb-y(x.comp)}" fill="var(--petrol)" rx="2"><title>contas ${brl(x.comp)}</title></rect><rect x="${cx+bw*.2}" y="${y(x.comp+x.g.total)}" width="${bw*.6}" height="${y(x.comp)-y(x.comp+x.g.total)}" fill="var(--ochre)"><title>gastos ${brl(x.g.total)}</title></rect>${x.renda?`<line x1="${cx+bw*.08}" x2="${cx+bw*.92}" y1="${y(x.renda)}" y2="${y(x.renda)}" stroke="var(--good)" stroke-width="2.5"/>`:""}<text x="${cx+bw/2}" y="${H-6}" text-anchor="middle">${MONTHS[i]}</text>`; }).join("")}
  </svg><p class="note">Azul: contas e dívidas. Ocre: gastos de notas e extratos. Verde: renda líquida.${ini > ms[0] ? ` Os meses antes de ${mesLabel(ini)} ficam de fora porque o controle começou nesse mês (ajuste em Regras e ajustes → Início do controle).` : ""}</p></section>
  <div class="grid g2" style="margin-top:16px"><section class="panel"><h2>Tabela</h2><div class="tbl"><table><thead><tr><th>Mês</th><th class="r">Renda</th><th class="r">Contas</th><th class="r">Gastos</th><th class="r">Sobra</th><th class="r">Inflação</th></tr></thead><tbody>
    ${rs.filter(x=>!x.fora).map(x=>`<tr${x.fut?' class="sub"':""}><td>${mesLabel(x.m)}${x.fut?' <small class="mut">previsto</small>':""}</td><td class="r num">${brl(x.renda)}</td><td class="r num">${brl(x.comp)}</td><td class="r num">${brl(x.gastosS)}</td><td class="r num ${x.sobra>=0?"pos":"neg"}">${isFinite(x.sobra)?brl(x.sobra):"–"}</td><td class="r num">${x.inf.ok?pct(x.inf.taxa,2):"–"}</td></tr>`).join("")}</tbody></table></div><p class="note">Sobra = renda − contas − gastos, a mesma conta do Painel e da Projeção. Meses futuros: gastos pela média.</p></section>

function lerParam(form){
  const np = JSON.parse(JSON.stringify(P())); const fd = new FormData(form);
  const linhas = (s, n) => String(s).split(/\n/).map(l => l.split(";").map(x=>x.trim())).filter(r => r[0]).map(r => r.slice(0,n).map((x,i) => /^acima/i.test(x) ? null : toNum(x)));
  for (const [k,v] of fd.entries()){
    if (k === "refIndices"){ np.refIndices = v; continue; }
    if (k === "inicioControle"){ np.inicioControle = /^\d{4}-\d{2}$/.test(v) ? v : ""; continue; }
    if (k === "reservaFases"){ np.reservaFases = v.split(/[,;\s]+/).map(Number).filter(x=>x>0); continue; }
    if (k === "irrf.faixas"){ np.irrf.faixas = linhas(v,3); continue; }
    if (k === "inss.faixas"){ np.inss.faixas = linhas(v,2); continue; }
    if (k === "rfIR"){ np.rfIR = linhas(v,2); continue; }
    if (k === "prevRegressiva"){ np.prevRegressiva = linhas(v,2); continue; }
    if (k.startsWith("simples.")){ np.simples = {...(np.simples||{}), [k.slice(8)]: linhas(v,3)}; continue; }
    if (k.startsWith("seg.")){ const n = toNum(v); if (isFinite(n)) np.seg = {...(np.seg||{}), [k.slice(4)]: n}; continue; }
    if (k.startsWith("dec.")){ const n = toNum(v); if (isFinite(n)) np.dec = {...(np.dec||{}), [k.slice(4)]: n}; continue; }
    if (k.startsWith("alan.")){ const n = toNum(v); if (isFinite(n)) np.alan = {...(np.alan||{}), [k.slice(5)]: n}; continue; }
    if (k === "dolar"){ const n = toNum(v); np.dolar = isFinite(n) && n > 0 ? n : null; continue; }
    if (k === "cargaConsumo"){ const o = {}; String(v).split(/\n/).forEach(l => { const [c,a] = l.split(";").map(x=>x&&x.trim()); if (c && isFinite(toNum(a))) o[c] = toNum(a); }); np.cargaConsumo = o; continue; }
    const n = toNum(v); if (!isFinite(n)) continue; const path = k.split("."); let o = np; while (path.length > 1) o = o[path.shift()]; o[path[0]] = n;
  }
  return np;
}

function fracaoComp(c){ if (c.compartilhar === "total") return 1; if (c.compartilhar === "parte") return clamp((Number(c.partePct)||0)/100, 0, 1); return 0; }

async function sincronizarEspelho(c){
  if (!S.db || !c.id) return; const ref = S.db.collection("casa").doc("esp-"+c.id); const f = fracaoComp(c);

function valorReceber(c){
  const p = P(); const orig = Number(c.valor)||0; const ini = c.data ? new Date(c.data+"T12:00") : hoje; const dias = Math.max(0, (hoje - ini)/864e5);
  const venc = c.vencimento ? new Date(c.vencimento+"T12:00") : null; let atraso = venc ? Math.max(0, Math.floor((hoje - venc)/864e5)) : 0;
  const pl = planoReceber(c); if (pl) atraso = pl.atraso;
  const fIPCA = Math.pow(1+p.ipca12/100, dias/365); let fator = 1;
  if (c.correcao === "ipca") fator = fIPCA; else if (c.correcao === "cdi") fator = Math.pow(1+p.cdi/100, dias/365); else if (c.correcao === "juros") fator = Math.pow(1+(Number(c.jurosMes)||0)/100, dias/30.4375);

  const recebido = Number(c.recebido)||0; const saldo = c.status === "recebido" || c.status === "perdido" ? 0 : Math.max(0, corrigido + multa - recebido);

/* ================= situação financeira (diagnóstico) ================= */
function meusGastosMes(m){ return gastosPessoaMes(m).total; }
function inicioControle(){
  const p = P(); if (/^\d{4}-\d{2}$/.test(p.inicioControle || "")) return p.inicioControle;
  const c = [...S.notas.map(n => n.mes), ...S.cad.filter(x => x.tipo === "extrato").map(x => x.mes), ...S.cad.filter(x => x.tipo === "conta" && x.status === "ativa").map(x => x.inicio), ...(S.casa||[]).map(x => x.inicio)].filter(x => /^\d{4}-\d{2}$/.test(x||"")).sort();

function gastoMedioMes(){

  for (let k = 0; k < 6; k++){ const m = addMes(MES_ATUAL, -k); if (m < ini) break; const v = gastosPessoaMes(m).total; if (v > 0) xs.push(v); }

  const renda = sum(rendasMes(m,false,true).map(x=>x.liquido)), rendaP = sum(rendasMes(m,true,true).map(x=>x.liquido)); const contas = sum(compromissosMes(m).map(x=>x.v));

function situacao(){
  const p = P(); const gastoMedio = gastoMedioMes(); const os = Array.from({length:12}, (_,k) => orcamentoMes(addMes(MES_ATUAL, k), gastoMedio));
  const rendaMedia = sum(os.map(o => o.renda))/12, compMedia = sum(os.map(o => o.contas))/12;
  const sobra = rendaMedia - compMedia - gastoMedio; const piorMes = os.slice().sort((a,b) => a.sobra - b.sobra)[0]; const mesesNeg = os.filter(o => o.sobra < 0).length;
  const ativas = rendasMes(MES_ATUAL,false,true); const totA = sum(ativas.map(x=>x.liquido));
  const em6 = addMes(MES_ATUAL, 6);
  const acaba = ativas.filter(x => x.c.fim && x.c.fim <= em6); const queda = sum(acaba.map(x=>x.liquido));
  const estaveis = ativas.filter(x => x.c.estabilidade === "estavel" && !(x.c.fim && x.c.fim <= em6)); const pEstavel = totA ? sum(estaveis.map(x=>x.liquido))/totA : 0;

  if (reserva < custo*mesesRec) motivos.push(`Reserva de ${brl(reserva)}; a recomendada para a sua situação é ${mesesRec} meses (${brl(custo*mesesRec)}).`);

  return {rendaMedia, compMedia, gastoMedio, sobra, piorMes, mesesNeg, queda, pEstavel, custo, reserva, mesesRec, cartao, nivel, rot, motivos, comprometimento: rendaMedia ? compMedia/rendaMedia : NaN};
}

const normNome = s => String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const addMesesData = (iso, k) => { const [y,m,d] = String(iso).slice(0,10).split("-").map(Number); const dt = new Date(Date.UTC(y, m-1+k, d)); return dt.toISOString().slice(0,10); };
const hojeISO = () => { const h = new Date(); return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0"); };
const dataBR = iso => iso ? String(iso).slice(0,10).split("-").reverse().join("/") : "–";
function aliqPrev(dias){ for (const [lim, al] of P().prevRegressiva) if (lim === null || dias/365 <= lim) return al/100; return .10; }
function poupancaAA(){ const p = P(); return p.selic > 8.5 ? Math.pow(1.005, 12) - 1 : p.selic/100*0.7; }
function irVenda(prod, ganho, valorVenda){
  const p = P(); const pr = PROD[prod] || PROD.outro; if (!(ganho > 0)) return 0;
  if (pr.ir === "acao") return valorVenda <= p.acoesIsencao ? 0 : ganho*p.acoesAliq/100;
  if (pr.ir === "fii") return ganho*p.fiiGanho/100;
  if (pr.ir === "etf" || pr.ir === "exterior") return ganho*0.15;
  if (pr.ir === "fundo") return ganho*0.15;
  if (pr.ir === "cripto") return valorVenda <= p.cripIsencao ? 0 : ganho*0.15;
  return 0;
}
function opsDe(c){ const n = normNome(c.nome); return S.cad.filter(o => o.tipo === "operacao" && donoDe(o) === donoDe(c) && normNome(o.nome) === n && (o.carteira||"") === (c.carteira||"")).sort((a,b) => String(a.data).localeCompare(String(b.data))); }
function posicaoOps(c){
  const ops = opsDe(c); if (!ops.length) return null; const pr = PROD[c.produto] || PROD.outro;
  const val = o => Number(o.valor) || (Number(o.quantidade)||0)*(Number(o.preco)||0);
  const umAno = addMesesData(hojeISO(), -12);
  const proventos12 = sum(ops.filter(o => ["provento","juros"].includes(o.op) && String(o.data) >= umAno).map(val));
  if (pr.g === "rv"){
    let q = 0, custo = 0, realizado = 0; const vendas = [];
    ops.forEach(o => { const qq = Number(o.quantidade)||0;
      if (o.op === "compra" || o.op === "aporte"){ q += qq; custo += val(o); }
      else if (o.op === "venda" || o.op === "resgate"){ const pm = q ? custo/q : 0; const vv = val(o); const g = vv - qq*pm; realizado += g; vendas.push({data:o.data, valor:vv, ganho:g, produto:c.produto}); custo -= qq*pm; q -= qq; } });
    const campos = {quantidade: Math.round(q*1e6)/1e6, precoMedio: q > 0 ? custo/q : 0};
    if (!(Number(c.dpa) > 0) && q > 0 && proventos12) campos.dpa = proventos12/q;
    return {campos, realizado, vendas, proventos12, n:ops.length};
  }
  const fluxos = ops.filter(o => ["aporte","compra","resgate","venda"].includes(o.op)).map(o => ({data:o.data, v:(o.op === "resgate" || o.op === "venda") ? -val(o) : val(o)}));
  return {campos:{aplicado: sum(fluxos.map(f => f.v)), dataAplic: fluxos[0]?.data || c.dataAplic}, fluxos, realizado:0, vendas:[], proventos12, n:ops.length};
}
function taxaAnual(c, pr){
  const p = P(); const tx = Number(c.taxa)||0; const idx = pr.g === "prev" ? "pre" : (c.indexador || pr.idx);
  if (idx === "cdi") return p.cdi/100*(tx || 100)/100;
  if (idx === "selic") return p.selic/100 + tx/100;
  if (idx === "ipca") return (1+p.ipca12/100)*(1+tx/100) - 1;
  if (idx === "poup") return poupancaAA();
  return tx/100;
}
function valorInvest(c0){
  const p = P(); const pos = posicaoOps(c0); const c = pos ? {...c0, ...pos.campos} : c0; const pr = PROD[c.produto] || PROD.outro;
  let out;
  if (pr.g === "rv"){
    const fx = pr.usd ? (Number(p.dolar) || 1) : 1;
    const q = Number(c.quantidade)||0, pa = Number(c.precoAtual)||Number(c.precoMedio)||0, pm = Number(c.precoMedio)||0;
    const atual = q*pa*fx, custo = (q*pm || Number(c.aplicado)||0)*fx; const dpa = Number(c.dpa)||0; const vi = Number(c.valorIntrinseco)||0;
    out = {atual, custo, ganho:atual-custo, ir:irVenda(c.produto, atual-custo, atual), dy: pa ? dpa/pa : NaN, teto: dpa ? dpa/(p.dyMin/100) : NaN, margem: vi ? (vi-pa)/vi : NaN, preco:pa};
  } else if (pr.g === "neg"){
    const ap = Number(c.aplicado)||0, l = Number(c.lucroMes)||0; out = {atual:ap, custo:ap, ganho:0, ir:0, roi: ap ? l*12/ap : NaN, lucroMes:l};
  } else {
    const r = taxaAnual(c, pr); const hj = new Date(hojeISO()+"T12:00");
    const dd = d => d ? Math.max(0, (hj - new Date(String(d).slice(0,10)+"T12:00"))/864e5) : 0;
    let atual, custo, dias;
    if (pos?.fluxos?.length){ atual = sum(pos.fluxos.map(f => f.v*Math.pow(1+r, dd(f.data)/365))); custo = sum(pos.fluxos.map(f => f.v));
      const posit = pos.fluxos.filter(f => f.v > 0); dias = sum(posit.map(f => f.v*dd(f.data))) / (sum(posit.map(f => f.v)) || 1); }
    else { custo = Number(c.aplicado)||0; dias = dd(c.dataAplic); atual = custo*Math.pow(1+r, dias/365); }
    const ganho = atual - custo; let ir = 0;
    if (pr.ir === "rf") ir = Math.max(0, ganho)*aliqRF(dias); else if (pr.ir === "prev") ir = Math.max(0, c.planoPrev === "pgbl" ? atual : ganho)*aliqPrev(dias);
    if (Number(c.valorInformado) > 0 && c.dataValorInf){ atual = Number(c.valorInformado)*Math.pow(1+r, dd(c.dataValorInf)/365) + sum((pos?.fluxos||[]).filter(f => String(f.data) > String(c.dataValorInf)).map(f => f.v*Math.pow(1+r, dd(f.data)/365))); }
    const ganho2 = atual - custo; ir = pr.ir === "rf" ? Math.max(0, ganho2)*aliqRF(dias) : pr.ir === "prev" ? Math.max(0, c.planoPrev === "pgbl" ? atual : ganho2)*aliqPrev(dias) : 0;
    out = {atual, custo, ganho:ganho2, ir, dias, r};
  }
  const car = c.carenciaAte || (pr.carencia && c.dataAplic ? addMesesData(c.dataAplic, pr.carencia(c)) : "");
  out.carencia = car && car > hojeISO() ? car : ""; out.ops = pos?.n || 0; out.realizado = pos?.realizado || 0; out.vendas = pos?.vendas || []; out.proventos12 = pos?.proventos12 || 0; out.pr = pr;
  return out;
}
function opsSemInvestimento(){
  const nomes = new Set(meuCad("investimento").map(c => donoDe(c)+"|"+normNome(c.nome)+"|"+(c.carteira||"")));
  const vistos = new Map(); meuCad("operacao").forEach(o => { const k = donoDe(o)+"|"+normNome(o.nome)+"|"+(o.carteira||""); if (!nomes.has(k) && !vistos.has(k)) vistos.set(k, o); });
  return [...vistos.values()];

function fluxoDoMes(m){
  const ev = [];
  rendasMes(m, false).forEach(x => { if (x.liquido > 0.004) ev.push({dia:Number(x.c.diaPagamento)||0, nome:x.c.nome + (x.competencia !== m ? ` (referente a ${mesLabel(x.competencia)})` : ""), v:x.liquido, tipo:"entra"}); });
  rendasEstimadas(m).forEach(x => ev.push({dia:Number(x.c.diaPagamento)||0, nome:x.c.nome + ` (referente a ${mesLabel(x.competencia)}; estimado, aguardando ${ehEmpregoR(x.c) ? "contracheque" : "valor"}, fora do total)`, v:0, tipo:"entra"}));
  rendaOutros(m).forEach(x => ev.push({dia:0, nome:"Renda de "+x.p.nome+" (informada na divisão)", v:x.v, tipo:"entra"}));
  linhasPainel(m).forEach(l => ev.push({dia:diaVenc(l), nome:l.nome, v:l.v, tipo:"sai", pago:!!pagoInfo(m, l.chave)}));

/* ================= v5: imposto de renda anual e ganho de capital ================= */
function rendimentosAno(ano){
  const meses = []; const ext = {meiTrib:0, meiIsento:0, lucrosIsentos:0}; const mei = {};
  for (let k = 1; k <= 12; k++){
    const m = ano+"-"+String(k).padStart(2,"0"); let bruto = 0, inss = 0, irrf = 0; const fontes = new Set();
    const hs = meuCad("holerite").filter(h => mesPagoHolerite(h) === m && ["mensal","ferias",undefined,""].includes(h.tipoFolha));
    hs.forEach(h => { bruto += tributavelHolerite(h); inss += Number(h.inss)||0; irrf += Number(h.irrf)||0; }); if (hs.length) fontes.add("contracheque");
    meuCad("renda").forEach(c => { if (["liquido","passiva"].includes(c.regime || "liquido")) return; if (c.status === "planejada" && !(c.real && c.real[m])) return;
      const d = dreRenda(c, competenciaDe(c, m)); if (!d.receita || d.fonte === "contracheque") return; const est = m > MES_ATUAL ? "previsto" : d.fonte === "lançado" ? "lançado" : "estimado pelo cadastro";
      if (["clt","publico"].includes(c.regime)){ const refs = refsHolerite(c); const rb = sum(refs.map(h => Number(h.bruto)||0)); bruto += d.receita * (rb > 0 ? sum(refs.map(tributavelHolerite))/rb : 1); inss += d.inss; irrf += d.ir; fontes.add(est); }
      else if (c.regime === "autonomo"){ bruto += Math.max(0, d.receita - d.livroCaixa); inss += d.inss; irrf += d.ir; fontes.add(est+" (carnê-leão)"); }
      else if (c.regime === "empresa"){ const pl = Number(c.proLabore)||0; if (pl){ bruto += pl; inss += d.inss; irrf += d.ir; fontes.add(est+" (pró-labore)"); } ext.lucrosIsentos += Math.max(0, d.lucroLiquido); }
      else if (c.regime === "mei"){ const o = mei[c.id] || (mei[c.id] = {lucro:0, rec:0, pres:(P().presuncaoMei?.[c.dasTipo || "servicos"] ?? 32)/100}); o.lucro += d.receita - d.impReceita - d.cmv - d.venda - d.fixas - d.deprec; o.rec += d.receita; } });
    if (bruto || inss || irrf) meses.push({m, fonte:[...fontes].join(", ") || "—", bruto, inss, irrf});
  }
  Object.values(mei).forEach(o => { const isento = Math.min(Math.max(0, o.lucro), o.rec*o.pres); ext.meiIsento += isento; ext.meiTrib += Math.max(0, o.lucro - isento); });
  meses.ext = ext; return meses;
}
function irAnual(ano){
  const p = P(), a = p.irAnual, d = p.deducoes; const meses = rendimentosAno(ano);
  const ext = meses.ext || {meiTrib:0, meiIsento:0, lucrosIsentos:0};
  const rend = sum(meses.map(x=>x.bruto)) + ext.meiTrib, inss = sum(meses.map(x=>x.inss)), retido = sum(meses.map(x=>x.irrf));
  const tab = base => { for (const [lim, al, ded] of p.irrf.faixas){ const L = lim === null ? null : lim*12; if (L === null || base <= L) return Math.max(0, base*al/100 - ded*12); } return 0; };
  const reduz = ir => rend <= a.reducaoAte ? Math.min(a.reducaoMax, ir) : rend <= a.reducaoLimite ? Math.min(ir, Math.max(0, a.reducaoA - a.reducaoB*rend)) : 0;
  const dev = base => { const ir = tab(Math.max(0, base)); return Math.max(0, ir - reduz(ir)); };
  const dep = Number(d.dependentes)||0;
  const simp = dev(rend - Math.min(rend*0.2, a.simplificadoLimite));
  const dedComp = inss + dep*a.dependente + Math.min(Number(d.educacao)||0, a.educacaoLimite*(1+dep)) + (Number(d.saude)||0) + Math.min(Number(d.pgbl)||0, rend*0.12);
  const comp = dev(rend - dedComp);
  const modelo = comp < simp ? "completa" : "simplificada"; const devido = Math.min(simp, comp);
  return {meses, ext, rend, inss, retido, simp, comp, dedComp, modelo, devido, saldo: devido - retido};

function ganhosCapital(ano){
  const linhas = {}; const ext = {vendas:0, ganho:0};
  carteira().forEach(x => (x.vendas||[]).filter(v => String(v.data).startsWith(ano)).forEach(v => {

    return {...o, rot:rot[o.tipo]||o.tipo, imposto, obs, vence:addMes(o.m, 1)};

  return {rows, ext: {...ext, imposto: Math.max(0, ext.ganho)*0.15}};

function valorCampo(t, opts, v){
  if (v === null || v === undefined || v === "") return undefined;
  if (t === "num"){ const n = typeof v === "number" ? v : toNum(String(v)); return isFinite(n) ? Math.round(n*100)/100 : undefined; }
  if (t === "sel"){ const x = String(v); if (opts && x in opts) return x; const k = Object.entries(opts||{}).find(([,l]) => normNome(l) === normNome(x)); return k ? k[0] : undefined; }
  if (t === "cat") return CAT_NAMES.includes(v) ? v : undefined;
  if (t === "mes") return normMes(v) || undefined;
  if (t === "data") return dataISO(v) || undefined;
  if (["pessoa","esc","metaRef","area","rendaRef","carteiraRef"].includes(t)) return undefined;
  return String(v).slice(0, 200);
}
async function pdfImagens(file, max){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise; const out = [];
  for (let i = 1; i <= Math.min(doc.numPages, max); i++){ const pg = await doc.getPage(i); const vp = pg.getViewport({scale:1.6}); const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await pg.render({canvasContext:c.getContext("2d"), viewport:vp}).promise; out.push(await new Promise(r => c.toBlob(r, "image/png"))); }
  return out.filter(Boolean);
}
async function conteudoDoc(files){
  const lim = await S.sample.limits().catch(() => null); const maxImg = lim?.images?.maxCount || 0;
  let texto = ""; const imagens = [], nomes = [];
  for (const f of files){ nomes.push(f.name);
    if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){
      if (!window.pdfjsLib) throw new Error("O leitor de PDF não carregou. Recarregue a página.");
      const t = await pdfTexto(f);
      if (t.replace(/\s/g,"").length > 40) texto += `\n--- ${f.name} ---\n` + t;
      else { if (!maxImg) throw new Error(f.name+": PDF escaneado, e a leitura de imagens não está disponível aqui."); imagens.push(...await pdfImagens(f, Math.max(1, maxImg - imagens.length))); }
    } else if (/^image\//.test(f.type)){ if (!maxImg) throw new Error("A leitura de fotos não está disponível nesta visualização."); imagens.push(f); }
    else if (/\.(txt|csv|json|xml|html?|ofx)$/i.test(f.name)) texto += `\n--- ${f.name} ---\n` + (await f.text());
    else throw new Error(f.name+": formato não suportado. Envie PDF, foto ou texto.");
  }
  if (maxImg && imagens.length > maxImg) imagens.length = maxImg;
  return {texto: texto.slice(0, 80000), imagens, nomes};
}
async function perguntarDoc(prompt, files){

  if (f.id === "fDeduc"){ const d = {}; for (const [k,v] of new FormData(f).entries()) d[k] = toNum(v) || 0; salvarParam({...JSON.parse(JSON.stringify(P())), deducoes:d}); }
  if (f.id === "fAcerto"){ const fd = Object.fromEntries(new FormData(f)); if (fd.de === fd.para){ toast("Escolha duas pessoas diferentes."); return; } await registrarAcerto(fd.de, fd.para, toNum(fd.valor)); f.reset(); }
  if (f.id === "fCompra"){ const card = S.cad.find(c => c.id === f.dataset.card); const fd = Object.fromEntries(new FormData(f)); const total = toNum(fd.total);
    if (!card || !fd.nome || !(total > 0)){ toast("Preencha o que comprou e o valor."); return; }
    const n = Math.max(1, Math.round(toNum(fd.parcelas)||1)); const data = fd.data || hojeISO();
    if (await criarCompraCartao(card, {nome:fd.nome, data, total, parcelas:n, cat:fd.cat, pessoa:fd.pessoa})){ toast(`Compra lançada: ${n}× ${brl(total/n)} a partir da fatura de ${mesLabel(mesFatura(data, card))}.`); S.compra = null; render(); } }
});
