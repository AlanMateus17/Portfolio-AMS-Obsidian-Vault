<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 760 290" role="img" aria-label="O banco filtra cada linha pelo usuário logado" font-size="13"><defs><marker id="arq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#111827">O banco filtra cada linha pelo usuário logado</text><text data-claude-text-id="subtitle" x="24" y="54" font-size="11.5" fill="#4b5563">MVP rodando no seu computador; na nuvem, a mesma estrutura muda só de máquina</text><g data-claude-anchor="docker"><rect x="222" y="84" width="512" height="168" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"></rect><text data-claude-text-id="docker-name" x="238" y="106" font-size="11.5" font-weight="600" fill="#4b5563">Seu computador (Docker)</text></g><g data-claude-anchor="connectors" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M196 160H232" marker-end="url(#arq-arrow)"></path><path d="M384 160H401" marker-end="url(#arq-arrow)"></path><path d="M553 160H569" marker-end="url(#arq-arrow)"></path></g><g data-claude-anchor="navegador"><rect x="24" y="124" width="172" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="nav-name" x="110" y="148" text-anchor="middle" font-weight="600" fill="#111827">Navegador</text><text data-claude-text-id="nav-1" x="110" y="164" text-anchor="middle" font-size="11.5" fill="#4b5563">PC ou celular, mesmo Wi-Fi</text><text data-claude-text-id="nav-2" x="110" y="180" text-anchor="middle" font-size="11.5" fill="#4b5563">lê o PDF da NFC-e</text></g><g data-claude-anchor="site"><rect x="234" y="124" width="150" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="site-name" x="309" y="148" text-anchor="middle" font-weight="600" fill="#111827">Site Next.js</text><text data-claude-text-id="site-1" x="309" y="164" text-anchor="middle" font-size="11.5" fill="#4b5563">telas e formulários</text><text data-claude-text-id="site-2" x="309" y="180" text-anchor="middle" font-size="11.5" fill="#4b5563">repassa /api</text></g><g data-claude-anchor="api"><rect x="403" y="124" width="150" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="api-name" x="478" y="148" text-anchor="middle" font-weight="600" fill="#111827">API .NET 10</text><text data-claude-text-id="api-1" x="478" y="164" text-anchor="middle" font-size="11.5" fill="#4b5563">login por cookie</text><text data-claude-text-id="api-2" x="478" y="180" text-anchor="middle" font-size="11.5" fill="#4b5563">informa app.user_id</text></g><g data-claude-anchor="banco"><rect x="571" y="124" width="150" height="72" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="db-name" x="646" y="148" text-anchor="middle" font-weight="600" fill="#111827">PostgreSQL 16</text><text data-claude-text-id="db-1" x="646" y="164" text-anchor="middle" font-size="11.5" fill="#111827">RLS por pessoa</text><text data-claude-text-id="db-2" x="646" y="180" text-anchor="middle" font-size="11.5" fill="#111827">e por família</text></g><text data-claude-text-id="nota" x="478" y="228" text-anchor="middle" font-size="11.5" fill="#4b5563">a divisão do mês é uma função do banco: devolve só a parte de quem pede</text><text data-claude-text-id="nuvem" x="24" y="278" font-size="11.5" fill="#4b5563">Na nuvem: o mesmo docker-compose num servidor, com domínio e HTTPS na frente do site.</text></svg>