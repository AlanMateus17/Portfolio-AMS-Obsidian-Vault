<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 760 508" role="img" aria-label="Um servidor só atende tudo; vídeo, e-mail e pagamento ficam fora" font-size="13"><defs><marker id="arq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#111827">Um servidor só atende tudo; vídeo, e-mail e pagamento ficam fora</text><g data-claude-anchor="connectors" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M272 112V136" marker-end="url(#arq-arrow)"></path><path d="M272 192V216" marker-end="url(#arq-arrow)"></path><path d="M520 238H552" marker-end="url(#arq-arrow)"></path><path d="M520 290H552" marker-end="url(#arq-arrow)"></path><path d="M552 342H520" marker-end="url(#arq-arrow)"></path><path d="M156 352V384" marker-end="url(#arq-arrow)"></path><path d="M404 352V384" marker-end="url(#arq-arrow)"></path></g><g data-claude-anchor="navegador"><rect x="24" y="56" width="496" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="nav-nome" x="272" y="80" text-anchor="middle" font-weight="600" fill="#111827">Navegador (aluno e equipe)</text><text data-claude-text-id="nav-linha" x="272" y="97" text-anchor="middle" font-size="11.5" fill="#4b5563">páginas estáticas + plataforma.js + video.js</text></g><g data-claude-anchor="caddy"><rect x="24" y="136" width="496" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="caddy-nome" x="272" y="160" text-anchor="middle" font-weight="600" fill="#111827">Caddy</text><text data-claude-text-id="caddy-linha" x="272" y="177" text-anchor="middle" font-size="11.5" fill="#4b5563">HTTPS automático, cabeçalhos de segurança, redireciona www</text></g><g data-claude-anchor="sistema"><rect x="24" y="216" width="496" height="136" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="sistema-nome" x="40" y="238" font-weight="600" fill="#111827">Sistema · ASP.NET Core 10 em Docker</text></g><g data-claude-anchor="portao"><rect x="40" y="248" width="144" height="88" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="portao-nome" x="112" y="272" text-anchor="middle" font-weight="600" fill="#111827">Portão do site</text><text data-claude-text-id="portao-l1" x="112" y="290" text-anchor="middle" font-size="11.5" fill="#4b5563">livre, conta, pago</text><text data-claude-text-id="portao-l2" x="112" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">equipe, bloqueado</text><text data-claude-text-id="portao-l3" x="112" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">regras no banco</text></g><g data-claude-anchor="api"><rect x="200" y="248" width="144" height="88" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="api-nome" x="272" y="272" text-anchor="middle" font-weight="600" fill="#111827">API</text><text data-claude-text-id="api-l1" x="272" y="290" text-anchor="middle" font-size="11.5" fill="#4b5563">conta, 2FA, LGPD</text><text data-claude-text-id="api-l2" x="272" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">estudos e vídeo</text><text data-claude-text-id="api-l3" x="272" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">painel e vendas</text></g><g data-claude-anchor="servico-aulas"><rect x="360" y="248" width="144" height="88" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="aulas-nome" x="432" y="272" text-anchor="middle" font-weight="600" fill="#111827">Serviço de aulas</text><text data-claude-text-id="aulas-l1" x="432" y="290" text-anchor="middle" font-size="11.5" fill="#4b5563">roda gerar-aulas.py</text><text data-claude-text-id="aulas-l2" x="432" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">publica de uma vez</text><text data-claude-text-id="aulas-l3" x="432" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">guarda 30 versões</text></g><g data-claude-anchor="bunny"><rect x="552" y="216" width="184" height="44" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="bunny-nome" x="644" y="235" text-anchor="middle" font-weight="600" fill="#111827">Bunny Stream</text><text data-claude-text-id="bunny-linha" x="644" y="251" text-anchor="middle" font-size="11.5" fill="#4b5563">vídeo com token de 2 h</text></g><g data-claude-anchor="smtp"><rect x="552" y="268" width="184" height="44" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="smtp-nome" x="644" y="287" text-anchor="middle" font-weight="600" fill="#111827">E-mail (SMTP)</text><text data-claude-text-id="smtp-linha" x="644" y="303" text-anchor="middle" font-size="11.5" fill="#4b5563">confirmação e senha</text></g><g data-claude-anchor="gateway"><rect x="552" y="320" width="184" height="44" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="gateway-nome" x="644" y="339" text-anchor="middle" font-weight="600" fill="#111827">Gateway de pagamento</text><text data-claude-text-id="gateway-linha" x="644" y="355" text-anchor="middle" font-size="11.5" fill="#4b5563">avisa a venda (webhook)</text></g><g data-claude-anchor="postgres"><rect x="40" y="384" width="232" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="pg-nome" x="156" y="408" text-anchor="middle" font-weight="600" fill="#111827">PostgreSQL 16</text><text data-claude-text-id="pg-l1" x="156" y="426" text-anchor="middle" font-size="11.5" fill="#4b5563">usuários, planos, progresso</text><text data-claude-text-id="pg-l2" x="156" y="442" text-anchor="middle" font-size="11.5" fill="#4b5563">aulas, histórico, auditoria</text></g><g data-claude-anchor="volume"><rect x="288" y="384" width="232" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="vol-nome" x="404" y="408" text-anchor="middle" font-weight="600" fill="#111827">Volume de dados</text><text data-claude-text-id="vol-l1" x="404" y="426" text-anchor="middle" font-size="11.5" fill="#4b5563">gerações publicadas (atual.txt)</text><text data-claude-text-id="vol-l2" x="404" y="442" text-anchor="middle" font-size="11.5" fill="#4b5563">imagens, PDFs e vídeos locais</text></g><text data-claude-text-id="backup" x="24" y="484" font-size="11.5" fill="#4b5563">backup.sh copia o banco (30 dias) e as pastas de mídia e vídeo, todo dia</text></svg>