<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 760 288" role="img" aria-label="Quatro fases sequenciais, uma frente principal por vez" font-size="13"><defs><marker id="road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#111827">Uma frente principal por vez, em sequência</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#4b5563">A fase destacada é a atual; o resto é fila consciente</text><line x1="24" x2="736" y1="264" y2="264" stroke="#6b7280" stroke-width="1.25" marker-end="url(#road-arrow)"></line><g data-claude-anchor="fase-1"><rect x="24" y="92" width="214" height="150" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="f1-when" x="40" y="118" font-size="11.5" font-weight="600" fill="#2563eb">OUT–DEZ 2026</text><text data-claude-text-id="f1-a" x="40" y="144" font-weight="600" fill="#111827">ByteSDCoin em sala</text><text data-claude-text-id="f1-b" x="40" y="166" font-size="11.5" fill="#4b5563">+ mini-curso de Lógica</text><text data-claude-text-id="f1-c" x="40" y="188" font-size="11.5" fill="#4b5563">+ Passo 1 de estudo</text><text data-claude-text-id="f1-d" x="40" y="210" font-size="11.5" fill="#4b5563">+ limpeza blog/portfólio</text></g><g data-claude-anchor="fase-2"><rect x="256" y="92" width="214" height="150" rx="8" fill="#f3f4f6" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="f2-when" x="272" y="118" font-size="11.5" font-weight="600" fill="#4b5563">JAN–MAR 2027</text><text data-claude-text-id="f2-a" x="272" y="144" font-weight="600" fill="#111827">MVP do AM Kaixara</text><text data-claude-text-id="f2-b" x="272" y="166" font-size="11.5" fill="#4b5563">+ 2º infoproduto</text><text data-claude-text-id="f2-c" x="272" y="188" font-size="11.5" fill="#4b5563">+ Passo 2 de estudo</text><text data-claude-text-id="f2-d" x="272" y="210" font-size="11.5" fill="#4b5563">férias = janela grande</text></g><g data-claude-anchor="fase-3"><rect x="488" y="92" width="214" height="150" rx="8" fill="#f3f4f6" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="f3-when" x="504" y="118" font-size="11.5" font-weight="600" fill="#4b5563">ABR–JUN 2027</text><text data-claude-text-id="f3-a" x="504" y="144" font-weight="600" fill="#111827">AM Rendara</text><text data-claude-text-id="f3-b" x="504" y="166" font-size="11.5" fill="#4b5563">+ backend am-mentor</text><text data-claude-text-id="f3-c" x="504" y="188" font-size="11.5" fill="#4b5563">+ migrar portfólio</text><text data-claude-text-id="f3-d" x="504" y="210" font-size="11.5" fill="#4b5563">finanças puxam produto</text></g><g data-claude-anchor="fase-4"><rect x="720" y="92" width="214" height="150" rx="8" fill="#f3f4f6" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="f4-when" x="736" y="118" font-size="11.5" font-weight="600" fill="#4b5563">JUL–DEZ 2027</text><text data-claude-text-id="f4-a" x="736" y="144" font-weight="600" fill="#111827">AM Rotara + Taskoro</text><text data-claude-text-id="f4-b" x="736" y="166" font-size="11.5" fill="#4b5563">+ site Grupo AMtech</text><text data-claude-text-id="f4-c" x="736" y="188" font-size="11.5" fill="#4b5563">+ início freelance</text><text data-claude-text-id="f4-d" x="736" y="210" font-size="11.5" fill="#4b5563">sair do restaurante?</text></g><text data-claude-text-id="fila" x="24" y="286" font-size="11.5" fill="#4b5563">2028+ (fila): demais sistemas Aura, Instituto AMS completo, certificações de segurança, 3ª cripto, infra de 10 anos</text></svg>