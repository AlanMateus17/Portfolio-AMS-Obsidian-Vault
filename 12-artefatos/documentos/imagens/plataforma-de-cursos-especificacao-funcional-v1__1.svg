<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 760 528" role="img" aria-label="Cada escola é um espaço separado; a vitrine só mostra o que a escola escolhe" font-size="13"><defs><marker id="esc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker><marker id="esc-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#111827">Cada escola é um espaço separado; a vitrine só mostra o que a escola escolhe</text><g data-claude-anchor="connectors" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M132 112V144" marker-end="url(#esc-arrow)"></path><path d="M380 112V144" marker-end="url(#esc-arrow)"></path><path d="M628 112V144" marker-end="url(#esc-arrow)"></path><path d="M184 472H200" marker-end="url(#esc-arrow)"></path><path d="M368 472H384" marker-end="url(#esc-arrow)"></path><path d="M552 472H568" marker-end="url(#esc-arrow)"></path></g><g data-claude-anchor="vitrine-links" fill="none" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 4"><path d="M132 288V336" marker-end="url(#esc-arrow-acc)"></path><path d="M628 288V336" marker-end="url(#esc-arrow-acc)"></path></g><g data-claude-anchor="plataforma"><rect x="24" y="56" width="712" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="plat-nome" x="380" y="80" text-anchor="middle" font-weight="600" fill="#111827">Plataforma</text><text data-claude-text-id="plat-linha" x="380" y="97" text-anchor="middle" font-size="11.5" fill="#4b5563">uma conta por pessoa · administração · cobrança das escolas</text></g><g data-claude-anchor="escola-ams"><rect x="24" y="144" width="216" height="144" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ams-nome" x="132" y="168" text-anchor="middle" font-weight="600" fill="#111827">Instituto AMS</text><text data-claude-text-id="ams-linha" x="132" y="185" text-anchor="middle" font-size="11.5" fill="#4b5563">sua marca · professores convidados</text><rect x="36" y="200" width="192" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ams-c1" x="132" y="220" text-anchor="middle" font-size="11.5" fill="#111827">Catálogo do HTML</text><rect x="36" y="240" width="192" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ams-c2" x="132" y="260" text-anchor="middle" font-size="11.5" fill="#111827">Curso de um convidado</text></g><g data-claude-anchor="escola-ana"><rect x="272" y="144" width="216" height="144" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ana-nome" x="380" y="168" text-anchor="middle" font-weight="600" fill="#111827">Escola de Artes da Ana</text><text data-claude-text-id="ana-linha" x="380" y="185" text-anchor="middle" font-size="11.5" fill="#4b5563">marca e domínio dela</text><rect x="284" y="200" width="192" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ana-c1" x="380" y="220" text-anchor="middle" font-size="11.5" fill="#111827">Desenho básico</text><rect x="284" y="240" width="192" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ana-c2" x="380" y="260" text-anchor="middle" font-size="11.5" fill="#111827">Aquarela</text></g><g data-claude-anchor="escola-joao"><rect x="520" y="144" width="216" height="144" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="joao-nome" x="628" y="168" text-anchor="middle" font-weight="600" fill="#111827">Física Básica do João</text><text data-claude-text-id="joao-linha" x="628" y="185" text-anchor="middle" font-size="11.5" fill="#4b5563">marca e domínio dele</text><rect x="532" y="200" width="192" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="joao-c1" x="628" y="220" text-anchor="middle" font-size="11.5" fill="#111827">Cinemática</text><rect x="532" y="240" width="192" height="32" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="joao-c2" x="628" y="260" text-anchor="middle" font-size="11.5" fill="#111827">Leis de Newton</text></g><text data-claude-text-id="lista-1" x="140" y="316" font-size="11.5" fill="#4b5563">lista na vitrine</text><text data-claude-text-id="nao-lista" x="380" y="316" text-anchor="middle" font-size="11.5" fill="#4b5563">fica só na escola dela</text><text data-claude-text-id="lista-2" x="636" y="316" font-size="11.5" fill="#4b5563">lista na vitrine</text><g data-claude-anchor="vitrine"><rect x="24" y="336" width="712" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="vit-nome" x="380" y="360" text-anchor="middle" font-weight="600" fill="#111827">Vitrine geral (opcional)</text><text data-claude-text-id="vit-linha" x="380" y="377" text-anchor="middle" font-size="11.5" fill="#4b5563">a venda leva o aluno para a escola de origem</text></g><text data-claude-text-id="dentro-curso" x="24" y="432" font-weight="600" fill="#111827">Dentro de cada curso</text><g data-claude-anchor="hierarquia"><rect x="24" y="444" width="160" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="h-curso" x="104" y="466" text-anchor="middle" font-weight="600" fill="#111827">Curso</text><text data-claude-text-id="h-curso-l" x="104" y="484" text-anchor="middle" font-size="11.5" fill="#4b5563">capa, nível, preço</text><rect x="208" y="444" width="160" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="h-modulo" x="288" y="466" text-anchor="middle" font-weight="600" fill="#111827">Módulo</text><text data-claude-text-id="h-modulo-l" x="288" y="484" text-anchor="middle" font-size="11.5" fill="#4b5563">ordem, liberação</text><rect x="392" y="444" width="160" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="h-aula" x="472" y="466" text-anchor="middle" font-weight="600" fill="#111827">Aula</text><text data-claude-text-id="h-aula-l" x="472" y="484" text-anchor="middle" font-size="11.5" fill="#4b5563">amostra grátis ou não</text><rect x="576" y="444" width="160" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="h-blocos" x="656" y="466" text-anchor="middle" font-weight="600" fill="#111827">Blocos</text><text data-claude-text-id="h-blocos-l" x="656" y="484" text-anchor="middle" font-size="11.5" fill="#4b5563">vídeo, texto, questões</text></g></svg>