 (módulo Família)</text></g><g data-claude-anchor="step-recebe"><rect x="40" y="188" width="158" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="recebe" x="52" y="212" font-weight="600" fill="#111827">1 Recebe</text><text data-claude-text-id="recebe-l1" x="52" y="232" font-size="11.5" fill="#4b5563">hash evita duplicata</text></g><g data-claude-anchor="step-extrai"><rect x="214" y="188" width="158" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="extrai" x="226" y="212" font-weight="600" fill="#111827">2 Extrai</text><text data-claude-text-id="extrai-l1" x="226" y="232" font-size="11.5" fill="#4b5563">PDF direto ou OCR + IA</text><text data-claude-text-id="extrai-l2" x="226" y="248" font-size="11.5" fill="#4b5563">soma = total da nota</text></g><g data-claude-anchor="step-normaliza"><rect x="388" y="188" width="158" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="normaliza" x="400" y="212" font-weight="600" fill="#111827">3 Normaliza</text><text data-claude-text-id="normaliza-l1" x="400" y="232" font-size="11.5" fill="#4b5563">produto, unidade,</text><text data-claude-text-id="normaliza-l2" x="400" y="248" font-size="11.5" fill="#4b5563">categoria e pessoa</text></g><g data-claude-anchor="step-concilia"><rect x="562" y="188" width="158" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="concilia" x="574" y="212" font-weight="600" fill="#111827">4 Concilia</text><text data-claude-text-id="concilia-l1" x="574" y="232" font-size="11.5" fill="#4b5563">nota × extrato × fatura</text><text data-claude-text-id="concilia-l2" x="574" y="248" font-size="11.5" fill="#4b5563">vira um lançamento só</text></g><g data-claude-anchor="postgres"><rect x="24" y="308" width="340" height="88" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id