<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 760 460" role="img" aria-label="Todos os modulos leem o mesmo registro de lancamentos" font-size="13"><defs><marker id="mapa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#111827">Todos os módulos leem o mesmo registro de lançamentos</text><g data-claude-anchor="conectores" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M240 188H256V310H272" marker-end="url(#mapa-arrow)"></path><path d="M380 224V272" marker-end="url(#mapa-arrow)"></path><path d="M488 142H528" marker-end="url(#mapa-arrow)"></path><path d="M488 324H508V170H528" marker-end="url(#mapa-arrow)"></path><path d="M632 186V236" marker-end="url(#mapa-arrow)"></path></g><g data-claude-anchor="entram"><rect x="24" y="60" width="216" height="256" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="entram-nome" x="40" y="84" font-weight="600" fill="#111827">Entram</text><rect x="40" y="100" width="184" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="docs-nome" x="56" y="124" font-weight="600" fill="#111827">Documentos</text><text data-claude-text-id="docs-l1" x="56" y="144" font-size="11.5" fill="#4b5563">nota, extrato,</text><text data-claude-text-id="docs-l2" x="56" y="160" font-size="11.5" fill="#4b5563">contracheque, corretagem</text><rect x="40" y="188" width="184" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="lancar-nome" x="132" y="216" text-anchor="middle" font-weight="600" fill="#111827">+ Lançar</text><rect x="40" y="252" width="184" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="b3-nome" x="132" y="280" text-anchor="middle" font-weight="600" fill="#111827">Importação B3</text></g><g data-claude-anchor="cadastros"><rect x="272" y="60" width="216" height="164" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="cad-nome" x="288" y="84" font-weight="600" fill="#111827">Cadastros</text><text data-claude-text-id="cad-l1" x="288" y="108" fill="#4b5563">Contas e cartões</text><text data-claude-text-id="cad-l2" x="288" y="128" fill="#4b5563">Compromissos</text><text data-claude-text-id="cad-l3" x="288" y="148" fill="#4b5563">Fontes de renda</text><text data-claude-text-id="cad-l4" x="288" y="168" fill="#4b5563">Ativos e carteiras</text><text data-claude-text-id="cad-l5" x="288" y="188" fill="#4b5563">Bens e veículos</text><text data-claude-text-id="cad-l6" x="288" y="208" fill="#4b5563">Metas e rotina</text></g><text data-claude-text-id="geram" x="390" y="252" font-size="11.5" fill="#4b5563">geram previstos</text><g data-claude-anchor="lancamentos"><rect x="272" y="272" width="216" height="104" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="lanc-nome" x="380" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Lançamentos</text><text data-claude-text-id="lanc-l1" x="380" y="324" text-anchor="middle" font-size="11.5" fill="#111827">registro único do dinheiro</text><text data-claude-text-id="lanc-l2" x="380" y="342" text-anchor="middle" font-size="11.5" fill="#111827">previsto ou realizado</text><text data-claude-text-id="lanc-l3" x="380" y="360" text-anchor="middle" font-size="11.5" fill="#111827">em centavos</text></g><g data-claude-anchor="calculo"><rect x="528" y="60" width="208" height="126" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="calc-nom