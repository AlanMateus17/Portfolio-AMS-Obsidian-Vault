<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif" viewBox="0 0 760 336" role="img" aria-label="Cada fase só começa quando a anterior bate o critério" font-size="13"><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#111827">Cada fase só começa quando a anterior bate o critério</text><g data-claude-anchor="fase-validacao"><rect x="24" y="60" width="172" height="176" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><line x1="36" x2="184" y1="126" y2="126" stroke="#e5e7eb"></line><text data-claude-text-id="p1-nome" x="36" y="86" font-weight="600" fill="#111827">1. Validação</text><text data-claude-text-id="p1-data" x="36" y="108" font-size="11.5" fill="#4b5563">nov/2026 a jan/2027</text><text data-claude-text-id="p1-a" x="36" y="152" font-size="12" fill="#111827">PWA e backend próprio</text><text data-claude-text-id="p1-b" x="36" y="176" font-size="12" fill="#111827">Pacote do IR</text><text data-claude-text-id="p1-c" x="36" y="200" font-size="12" fill="#111827">20 usuários reais</text></g><g data-claude-anchor="fase-ir"><rect x="204" y="60" width="172" height="176" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><line x1="216" x2="364" y1="126" y2="126" stroke="#e5e7eb"></line><text data-claude-text-id="p2-nome" x="216" y="86" font-weight="600" fill="#111827">2. Temporada do IR</text><text data-claude-text-id="p2-data" x="216" y="108" font-size="11.5" fill="#4b5563">fev a mai/2027</text><text data-claude-text-id="p2-a" x="216" y="152" font-size="12" fill="#111827">IR avulso e Essencial</text><text data-claude-text-id="p2-b" x="216" y="176" font-size="12" fill="#111827">Open Finance</text><text data-claude-text-id="p2-c" x="216" y="200" font-size="12" fill="#111827">Sindicatos e conteúdo</text></g><g data-claude-anchor="fase-escritorios"><rect x="384" y="60" width="172" height="176" rx="8"