" stroke-width="1.25" stroke-dasharray="3 3"></line><path d="M380 256l9 9l-9 9l-9 -9z" fill="none" stroke="#6b7280" stroke-width="1.25"></path></g><text data-claude-text-id="g2-a" x="380" y="296" text-anchor="middle" font-size="11.5" fill="#111827">500 pagantes</text><text data-claude-text-id="g2-b" x="380" y="312" text-anchor="middle" font-size="11.5" fill="#4b5563">NPS acima de 50</text></g><g data-claude-anchor="criterio-3"><g><line x1="560" x2="560" y1="236" y2="256" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="3 3"></line><path d="M560 256l9 9l-9 9l-9 -9z" fill="none" stroke="#6b7280" stroke-width="1.25"></path></g><text data-claude-text-id="g3-a" x="560" y="296" text-anchor="middle" font-size="11.5" fill="#111827">10 escritórios pagando</text><text data-claude-text-id="g3-b" x="560" y="312" text-anchor="middle" font-size="11.5" fill="#4b5563">com horas economizadas</text></g></svg>