# Prompt curto: pasta, branch, estado do git e a linguagem do projeto. Nada de nuvem nem hora.
add_newline = false
format = "$directory$git_branch$git_status$dotnet$nodejs$golang$rust$python$cmd_duration$line_break$character"

[directory]
truncation_length = 3

[cmd_duration]
min_time = 2000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
