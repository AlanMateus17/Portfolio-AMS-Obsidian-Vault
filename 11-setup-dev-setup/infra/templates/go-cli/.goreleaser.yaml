# GoReleaser: binários para Linux, Windows e macOS e a release no GitHub a cada tag v*.
#   goreleaser release --snapshot --clean   (teste local, sem publicar)
version: 2
builds:
  - main: ./cmd/ferramenta
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
