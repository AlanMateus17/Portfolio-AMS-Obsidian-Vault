# Cada ferramenta paga e as rendas que ela ajuda ("*" = todas).
[[ferramenta]]
nome = "Claude Pro"
custo = 110
ofertas = ["*"]

[[ferramenta]]
nome = "Hostinger"
custo = 40
ofertas = ["sites"]

[[ferramenta]]
