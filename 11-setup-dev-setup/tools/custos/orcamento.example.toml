# Orçamento do setup, só para desenvolver e testar protótipos. Copie para ~/financas (fora do GitHub):
#   mkdir -p ~/financas && cp tools/custos/orcamento.example.toml ~/financas/orcamento.toml
#   python3 tools/custos/orcamento.py ~/financas/orcamento.toml
#
# custo = valor mínimo em reais; custo_max = teto (deixe de fora se for valor fixo).
# recorrente = true: é por mês (assinatura, GPU por hora). Sem isso, é compra única.
# venda = true: é para VENDER um produto, não para desenvolver → fica fora do total.
# etapa = 1 (começar agora), 2 (robótica importada), 3 (GPU). Os valores abaixo são estimativas: CONFIRME.

[geral]
ref_mes = "novembro/2026"

