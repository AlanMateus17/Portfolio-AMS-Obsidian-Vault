name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validar dados e documentação gerada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar e conferir arquivos gerados
        run: python tools/gerar_docs.py --check
      - name: Testar as regras do desenho (camadas, conexões e fluxos)
        run: python -m unittest discover -s tools -p "test_gerar_docs.py" -v
      - name: Testar ferramentas da editora
        run: python -m unittest discover -s tools/editora -v
      - name: Testar o motor financeiro dos negócios
        run: python -m unittest discover -s tools/negocios -v
      - name: Conferir os números gerados dos negócios
        run: python tools/negocios/gerar.py --check
      - name: Testar e conferir o portfólio de ofertas
        run: |
          python -m unittest discover -s tools/portfolio -v
          python tools/portfolio/portfolio.py --check
      - name: Testar o pipeline de conteúdo e conferir o roteiro de implantação
        run: |
          python -m unittest discover -s tools/conteudo -v
          python -m unittest discover -s tools/implantacao -v
          python -m unittest discover -s tools/acervo -v
          python tools/implantacao/gerar.py --check

  scripts:
    name: Validar scripts e Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning scripts/wsl/*.sh infra/automacao/*.sh infra/automacao/sql/*.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path scripts/windows -Settings PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Diagnóstico do Windows roda sem quebrar (dados vazios fora do Windows)
        shell: pwsh
        run: |
          ./scripts/windows/diagnostico.ps1 -Saida "$env:RUNNER_TEMP/diag"
          if (-not (Test-Path "$env:RUNNER_TEMP/diag/diagnostico.md")) { exit 1 }
      - name: Docker Compose da automação
        working-directory: infra/automacao
        env:
          METRICAS_SENHA: ci
          GRAFANA_DB_SENHA: ci
          GRAFANA_SENHA: ci
          N8N_CHAVE: ci
          AMTECH_DIR: /tmp/amtech
        run: docker compose config --quiet
